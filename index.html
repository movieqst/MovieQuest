<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Quest Canada — DVD, Blu-ray, VHS &amp; Music CDs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#131211;
    --paper:#FAF8F3;
    --card:#F1ECE0;
    --red:#C8102E;
    --red-dark:#98081F;
    --stone:#8C8578;
    --line:#E1DACB;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  /* ---------- Header / Marquee ---------- */
  header{
    background:var(--ink);
    color:var(--paper);
    padding:18px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    flex-wrap:wrap;
    border-bottom:6px solid var(--red);
  }
  .wordmark{
    font-family:'Anton',sans-serif;
    font-size:clamp(1.6rem,3.2vw,2.4rem);
    letter-spacing:1px;
    display:flex;
    align-items:baseline;
    gap:10px;
    text-decoration:none;
  }
  .wordmark span{color:var(--red);}
  .header-right{
    display:flex;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
  }
  .search-wrap{
    position:relative;
  }
  #searchInput{
    background:#1f1e1c;
    border:1px solid #3a3833;
    color:var(--paper);
    font-family:'JetBrains Mono',monospace;
    font-size:0.9rem;
    padding:10px 14px 10px 34px;
    border-radius:4px;
    width:220px;
    outline:none;
  }
  #searchInput::placeholder{color:#8a877e;}
  .search-wrap::before{
    content:"⌕";
    position:absolute;
    left:12px; top:50%;
    transform:translateY(-50%);
    color:#8a877e;
    font-size:1.1rem;
  }
  .store-link{
    font-family:'JetBrains Mono',monospace;
    font-size:0.8rem;
    font-weight:700;
    letter-spacing:0.5px;
    text-transform:uppercase;
    background:var(--red);
    color:var(--paper);
    padding:10px 16px;
    border-radius:4px;
    text-decoration:none;
    white-space:nowrap;
    transition:background 0.15s;
  }
  .store-link:hover{background:var(--red-dark);}

  /* ---------- Category strip (film-reel nav) ---------- */
  .reel-nav{
    background:var(--ink);
    padding:0 20px 14px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    border-bottom:1px solid #2a2925;
  }
  .reel-tab{
    font-family:'JetBrains Mono',monospace;
    font-size:0.78rem;
    font-weight:700;
    letter-spacing:0.4px;
    text-transform:uppercase;
    color:#c9c4b8;
    background:#1f1e1c;
    border:1px solid #34322d;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    transition:all 0.15s;
    position:relative;
  }
  .reel-tab::before{
    content:"○";
    color:#514f48;
    margin-right:6px;
    font-size:0.7rem;
  }
  .reel-tab:hover{ border-color:var(--red); color:var(--paper); }
  .reel-tab.active{
    background:var(--red);
    border-color:var(--red);
    color:var(--paper);
  }
  .reel-tab.active::before{ color:var(--paper); }

  .year-strip{
    background:#0f0e0d;
    padding:12px 20px;
    display:none;
    gap:6px;
    flex-wrap:wrap;
  }
  .year-strip.visible{ display:flex; }
  .year-chip{
    font-family:'JetBrains Mono',monospace;
    font-size:0.75rem;
    font-weight:500;
    color:#a29d90;
    background:transparent;
    border:1px solid #2f2d28;
    padding:5px 11px;
    border-radius:3px;
    cursor:pointer;
    transition:all 0.15s;
  }
  .year-chip:hover{ color:var(--paper); border-color:var(--stone); }
  .year-chip.active{
    color:var(--ink);
    background:var(--paper);
    border-color:var(--paper);
  }

  /* ---------- Controls ---------- */
  .controls-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 28px 6px;
    flex-wrap:wrap;
    gap:12px;
  }
  .result-count{
    font-family:'JetBrains Mono',monospace;
    font-size:0.85rem;
    color:var(--stone);
  }
  select{
    font-family:'JetBrains Mono',monospace;
    font-size:0.8rem;
    padding:7px 10px;
    border-radius:4px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
  }

  /* ---------- Card grid ---------- */
  .cards-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:22px;
    padding:18px 28px 60px;
  }
  .card{
    background:var(--card);
    border-radius:6px;
    overflow:hidden;
    text-decoration:none;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow:0 2px 0 var(--line);
    transition:transform 0.15s, box-shadow 0.15s;
  }
  .card:hover{
    transform:translateY(-4px);
    box-shadow:0 10px 24px rgba(0,0,0,0.18);
  }
  .card-poster{
    position:relative;
    aspect-ratio:5/7;
    background:#e5ded0;
    overflow:hidden;
  }
  .card-poster img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .format-tag{
    position:absolute;
    top:0; right:0;
    background:var(--red);
    color:var(--paper);
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:0.68rem;
    letter-spacing:0.5px;
    padding:5px 10px 5px 14px;
    clip-path:polygon(15px 0, 100% 0, 100% 100%, 0 100%);
  }
  .card-body{
    padding:12px 14px 14px;
    display:flex;
    flex-direction:column;
    gap:6px;
    flex:1;
  }
  .card-title{
    font-weight:700;
    font-size:0.95rem;
    line-height:1.25;
  }
  .card-barcode{
    margin-top:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-family:'JetBrains Mono',monospace;
    font-size:0.75rem;
    color:var(--stone);
    padding-top:8px;
    border-top:1px dashed var(--line);
  }
  .card-price{
    font-weight:700;
    color:var(--red);
  }

  .empty-state{
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
    color:var(--stone);
    font-family:'JetBrains Mono',monospace;
  }

  /* ---------- Ad banner ---------- */
  .ad-banner{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    padding:0 28px 40px;
  }
  .ad-slot{
    background:var(--card);
    border:1px dashed var(--line);
    border-radius:6px;
    min-height:90px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'JetBrains Mono',monospace;
    color:var(--stone);
    font-size:0.8rem;
  }
  .ad-slot img{ max-height:160px; }

  @media (max-width:640px){
    header{padding:14px 16px;}
    .reel-nav, .year-strip{ padding-left:16px; padding-right:16px; }
    .controls-bar{ padding-left:16px; padding-right:16px; }
    .cards-grid{ padding-left:16px; padding-right:16px; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:14px; }
    #searchInput{ width:160px; }
    .ad-banner{ grid-template-columns:repeat(2,1fr); padding-left:16px; padding-right:16px; }
  }
</style>
<base target="_blank">
</head>
<body>

<header>
  <a class="wordmark" href="./">MOVIE QUEST<span>·</span>CANADA</a>
  <div class="header-right">
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Search titles...">
    </div>
    <a class="store-link" href="https://www.ebay.ca/str/moviequest?mkcid=1&mkrid=706-53473-19255-0&siteid=2&campid=5339133571&customid=header&toolid=10001&mkevt=1" target="_blank" rel="noopener">Visit eBay Store →</a>
  </div>
</header>

<nav class="reel-nav" id="reelNav"></nav>
<div class="year-strip" id="yearStrip"></div>

<div class="controls-bar">
  <div class="result-count" id="resultCount">Loading catalogue…</div>
  <select id="sortSelect">
    <option value="title">Sort: Title A–Z</option>
    <option value="year-desc">Sort: Newest first</option>
    <option value="year-asc">Sort: Oldest first</option>
    <option value="price">Sort: Price low–high</option>
  </select>
</div>

<div class="cards-grid" id="cardsGrid"></div>

<div class="ad-banner">

 <div class="ad-slot"> <a id="logo-link" href="https://www.moviequest.ca/"><img src="https://moviequest.ca/logo.jpg" alt="MOVIE QUEST CANADA" width="150" height="150"></div>
 
  <div class="ad-slot"><a id="logo-link" href="https://www.aidashbd.com/"><img src="https://www.aidashbd.com/aidashbd.gif" alt="AI-DASHBoarD" width="150" height="150"></a></div>
 
  <div class="ad-slot">Ad Space</div>
  <div class="ad-slot">Ad Space</div>
</div>

<script>
const CATEGORIES = [
  { code:'all',      label:'All' },
  { code:'pre1949',  label:'Pre-1949' },
  { code:'1950s',    label:'1950s' },
  { code:'1960s',    label:'1960s' },
  { code:'1970s',    label:'1970s' },
  { code:'1980s',    label:'1980s', years:[1980,1981,1982,1983,1984,1985,1986,1987,1988,1989] },
  { code:'1990s',    label:'1990s', years:[1990,1991,1992,1993,1994,1995,1996,1997,1998,1999] },
  { code:'2000s',    label:'2000s', years:[2000,2001,2002,2003,2004,2005,2006,2007,2008,2009] },
  { code:'2010s',    label:'2010s', years:[2010,2011,2012,2013,2014,2015,2016,2017,2018,2019] },
  { code:'2020s',    label:'2020s' },
  { code:'tvseries', label:'TV Series' },
  { code:'etc',      label:'ETC' },
  { code:'music',    label:'Music CDs' }
];

const slugify = (name) => name.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');

let allItems = [];
let activeCategory = 'all';
let activeYear = null;
let searchTerm = '';

const reelNav = document.getElementById('reelNav');
const yearStrip = document.getElementById('yearStrip');
const cardsGrid = document.getElementById('cardsGrid');
const resultCount = document.getElementById('resultCount');
const sortSelect = document.getElementById('sortSelect');
const searchInput = document.getElementById('searchInput');

function buildReelNav(){
  reelNav.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const tab = document.createElement('div');
    tab.className = 'reel-tab' + (cat.code === activeCategory ? ' active' : '');
    tab.textContent = cat.label;
    tab.onclick = () => {
      activeCategory = cat.code;
      activeYear = null;
      buildReelNav();
      buildYearStrip();
      render();
    };
    reelNav.appendChild(tab);
  });
}

function buildYearStrip(){
  const cat = CATEGORIES.find(c => c.code === activeCategory);
  if (!cat || !cat.years){
    yearStrip.classList.remove('visible');
    yearStrip.innerHTML = '';
    return;
  }
  yearStrip.classList.add('visible');
  yearStrip.innerHTML = '';
  cat.years.forEach(y => {
    const chip = document.createElement('div');
    chip.className = 'year-chip' + (activeYear === y ? ' active' : '');
    chip.textContent = y;
    chip.onclick = () => {
      activeYear = (activeYear === y) ? null : y;
      buildYearStrip();
      render();
    };
    yearStrip.appendChild(chip);
  });
}

function formatPrice(p){
  if (p === undefined || p === null) return '—';
  return '$' + Number(p).toFixed(2);
}

function render(){
  let items = allItems.filter(item => {
    if (activeCategory !== 'all' && !(item.categories || []).includes(activeCategory)) return false;
    if (activeYear){
      const itemYears = item.years || (item.year != null ? [item.year] : []);
      if (!itemYears.includes(activeYear)) return false;
    }
    if (searchTerm && !item.title.toLowerCase().includes(searchTerm)) return false;
    return true;
  });

  switch(sortSelect.value){
    case 'year-desc': items.sort((a,b) => (b.year||0) - (a.year||0)); break;
    case 'year-asc':  items.sort((a,b) => (a.year||0) - (b.year||0)); break;
    case 'price':     items.sort((a,b) => (a.price||0) - (b.price||0)); break;
    default:          items.sort((a,b) => a.title.localeCompare(b.title));
  }

  resultCount.textContent = `${items.length} item${items.length === 1 ? '' : 's'} in the catalogue`;

  cardsGrid.innerHTML = '';
  if (items.length === 0){
    cardsGrid.innerHTML = '<div class="empty-state">No titles match that search. Try another year, category, or keyword.</div>';
    return;
  }

  items.forEach(item => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = `item.html?id=${encodeURIComponent(item.id)}`;
    a.innerHTML = `
      <div class="card-poster">
        <img src="${item.image}" alt="${item.title}" loading="lazy">
        <div class="format-tag">${item.format}</div>
      </div>
      <div class="card-body">
        <div class="card-title">${item.title}</div>
        <div class="card-barcode">
          <span>${item.year || ''}</span>
          <span class="card-price">${formatPrice(item.price)}</span>
        </div>
      </div>
    `;
    cardsGrid.appendChild(a);
  });
}

async function init(){
  const params = new URLSearchParams(window.location.search);
  const catParam = params.get('cat');
  const yearParam = params.get('year');
  const qParam = params.get('q');

  if (catParam && CATEGORIES.some(c => c.code === catParam)) activeCategory = catParam;
  if (yearParam) activeYear = parseInt(yearParam, 10);
  if (qParam){
    searchTerm = qParam.toLowerCase().trim();
    searchInput.value = qParam;
  }

  buildReelNav();
  buildYearStrip();
  try {
    const res = await fetch('data.json');
    allItems = await res.json();
    render();
  } catch (err){
    resultCount.textContent = 'Error loading catalogue.';
    console.error(err);
  }
}

sortSelect.addEventListener('change', render);
searchInput.addEventListener('input', (e) => {
  searchTerm = e.target.value.toLowerCase().trim();
  render();
});

init();
</script>
</body>
</html>
