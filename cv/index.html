<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Video Normalizer — Convert to Editor-Ready MP4</title>
<style>
  body {
    background:#0b0f1a; color:#eee; font-family: system-ui, sans-serif;
    display:flex; flex-direction:column; align-items:center; padding:40px;
  }
  h1 { background: linear-gradient(90deg,#f0f,#0ff); -webkit-background-clip:text; color:transparent; }
  #drop {
    border:2px dashed #555; border-radius:12px; width:600px; padding:60px;
    text-align:center; cursor:pointer; margin-bottom:20px;
  }
  #drop.drag { border-color:#0ff; background:#111; }
  .file-row {
    width:600px; background:#151a26; border-radius:8px; padding:12px 16px;
    margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;
  }
  .file-row .status { font-size:0.85em; color:#8fd; }
  button {
    background:#1e90ff; color:white; border:none; padding:10px 18px;
    border-radius:6px; cursor:pointer; font-size:1em; margin-top:10px;
  }
  button:disabled { background:#444; cursor:not-allowed; }
  #log {
    width:600px; height:140px; background:#000; color:#0f0; font-family:monospace;
    font-size:0.8em; overflow-y:auto; padding:10px; border-radius:6px; margin-top:20px;
  }
  select, .quality-row { margin-top:10px; }
  a.dl { color:#0ff; }
</style>
</head>
<body>

<h1>🎞 Video Normalizer</h1>
<p>Drop any video file — get back an editor-ready MP4 (H.264 / yuv420p / AAC). Files never leave your device.</p>

<div id="drop">Drop video files here<br><small>or click to browse</small></div>
<input type="file" id="fileInput" accept="video/*" multiple style="display:none">

<div class="quality-row">
  Quality:
  <select id="crf">
    <option value="16">Highest (CRF 16 — larger files)</option>
    <option value="18" selected>Recommended (CRF 18 — visually lossless)</option>
    <option value="20">Smaller (CRF 20 — great, slightly smaller)</option>
  </select>
</div>

<div id="fileList"></div>

<button id="convertBtn" disabled>Convert All</button>

<div id="log"></div>

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>

<script>
const { FFmpeg } = FFmpegWASM;
const { fetchFile, toBlobURL } = FFmpegUtil;

const drop = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
const fileListEl = document.getElementById('fileList');
const convertBtn = document.getElementById('convertBtn');
const logEl = document.getElementById('log');
const crfSelect = document.getElementById('crf');

let files = [];
let ffmpeg = null;
let ffmpegLoaded = false;

function log(msg) {
  logEl.innerHTML += msg + "<br>";
  logEl.scrollTop = logEl.scrollHeight;
}

async function loadFFmpeg() {
  if (ffmpegLoaded) return;
  log("Loading ffmpeg.wasm core...");
  ffmpeg = new FFmpeg();
  ffmpeg.on('log', ({ message }) => log(message));
  const baseURL = "https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd";
  await ffmpeg.load({
    coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
    wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
  });
  ffmpegLoaded = true;
  log("ffmpeg.wasm ready.");
}

function renderFileList() {
  fileListEl.innerHTML = '';
  files.forEach((f, i) => {
    const row = document.createElement('div');
    row.className = 'file-row';
    row.innerHTML = `
      <span>${f.file.name} (${(f.file.size/1024/1024).toFixed(1)} MB)</span>
      <span class="status" id="status-${i}">Pending</span>
    `;
    fileListEl.appendChild(row);
  });
  convertBtn.disabled = files.length === 0;
}

function addFiles(fileArray) {
  for (const file of fileArray) {
    if (file.type.startsWith('video/') || /\.(mp4|mov|mkv|avi|webm|wmv|flv|m4v)$/i.test(file.name)) {
      files.push({ file });
    }
  }
  renderFileList();
}

drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag'); });
drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
drop.addEventListener('drop', e => {
  e.preventDefault();
  drop.classList.remove('drag');
  addFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', e => addFiles(e.target.files));

convertBtn.addEventListener('click', async () => {
  convertBtn.disabled = true;
  await loadFFmpeg();
  const crf = crfSelect.value;

  for (let i = 0; i < files.length; i++) {
    const { file } = files[i];
    const statusEl = document.getElementById(`status-${i}`);
    statusEl.textContent = "Converting...";
    log(`\n--- Converting ${file.name} ---`);

    const inName = `in_${i}${getExt(file.name)}`;
    const outName = `out_${i}.mp4`;

    try {
      await ffmpeg.writeFile(inName, await fetchFile(file));

      await ffmpeg.exec([
        '-i', inName,
        '-c:v', 'libx264',
        '-profile:v', 'high',
        '-pix_fmt', 'yuv420p',
        '-crf', crf,
        '-preset', 'medium',
        '-c:a', 'aac',
        '-b:a', '192k',
        '-ar', '48000',
        '-movflags', '+faststart',
        outName
      ]);

      const data = await ffmpeg.readFile(outName);
      const blob = new Blob([data.buffer], { type: 'video/mp4' });
      const url = URL.createObjectURL(blob);

      statusEl.innerHTML = `<a class="dl" href="${url}" download="${stripExt(file.name)}_normalized.mp4">Download ✅</a>`;

      await ffmpeg.deleteFile(inName);
      await ffmpeg.deleteFile(outName);

    } catch (err) {
      statusEl.textContent = "Error ❌";
      log(`Error converting ${file.name}: ${err.message || err}`);
    }
  }

  convertBtn.disabled = false;
  log("\nAll conversions complete.");
});

function getExt(name) {
  const m = name.match(/\.[^.]+$/);
  return m ? m[0] : '.mp4';
}
function stripExt(name) {
  return name.replace(/\.[^.]+$/, '');
}
</script>

</body>
</html>
