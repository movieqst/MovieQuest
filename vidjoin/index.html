<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced MP4 Joiner</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a12;
      --bg2: #0f0f1a;
      --bg3: #13131f;
      --card: #111120;
      --border: #1e1e30;
      --text: #d8d8e8;
      --muted: #555570;
      --blue: #4dabf7;
      --amber: #feca57;
      --green: #51cf66;
      --red: #ff6b6b;
      --radius: 10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 260px;
    }

    header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #fff;
    }
    header p { font-size: 0.8rem; color: var(--muted); margin-top: 3px; }

    #ffmpegBar {
      position: absolute;
      bottom: 0; left: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--blue), var(--amber));
      width: 0%;
      transition: width 0.3s;
      display: none;
    }
    #ffmpegBar.active { display: block; }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Drop zone */
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 40px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--blue);
      background: rgba(77, 171, 247, 0.05);
    }
    .drop-zone .icon {
      font-size: 2.5rem;
      margin-bottom: 10px;
      pointer-events: none;
    }
    .drop-zone p { color: var(--muted); font-size: 0.9rem; pointer-events: none; }
    .drop-zone p strong { color: var(--text); }
    input[type="file"] { display: none; }

    /* Clips */
    #clipsArea { display: flex; flex-direction: column; gap: 4px; }

    .clip-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .clip-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: rgba(0,0,0,0.2);
      border-bottom: 1px solid var(--border);
    }
    .clip-thumb {
      width: 96px;
      height: 54px;
      border-radius: 6px;
      background: #080810;
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
      cursor: pointer;
    }
    .clip-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .clip-thumb .play-ovr {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.4);
      opacity: 0;
      transition: opacity 0.15s;
      font-size: 1.2rem;
    }
    .clip-thumb:hover .play-ovr { opacity: 1; }
    .clip-title {
      flex: 1;
      font-size: 0.85rem;
      color: #ccc;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .clip-num { color: var(--blue); font-weight: 700; margin-right: 4px; }
    .clip-ctrls { display: flex; gap: 4px; }
    .clip-ctrls button {
      background: var(--bg2);
      border: 1px solid var(--border);
      color: var(--muted);
      width: 30px;
      height: 30px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .clip-ctrls button:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
    .clip-ctrls button.del:hover:not(:disabled) { border-color: var(--red); color: var(--red); }
    .clip-ctrls button:disabled { opacity: 0.25; cursor: default; }

    .clip-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }

    /* Timeline vis */
    .tl-bar {
      height: 28px;
      background: #0a0a14;
      border-radius: 6px;
      position: relative;
      overflow: hidden;
    }
    .tl-seg {
      position: absolute;
      height: 10px;
      border-radius: 3px;
    }
    .tl-seg.vid { top: 4px; background: var(--blue); opacity: 0.85; }
    .tl-seg.aud { top: 16px; background: var(--amber); opacity: 0.8; height: 8px; }
    .tl-hint {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.65rem;
      color: var(--muted);
      font-family: monospace;
    }

    /* Split toggle */
    .split-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .split-toggle input { accent-color: var(--amber); width: 14px; height: 14px; cursor: pointer; }

    /* Trim grid */
    .trim-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .trim-grid.merged { grid-template-columns: 1fr 1fr; }
    .trim-grid.split4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
    .trim-row { display: flex; flex-direction: column; gap: 3px; }
    .trim-row label {
      font-size: 0.7rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }
    .trim-row label .val { font-family: monospace; color: #aaa; }
    .trim-row input[type=range] { width: 100%; accent-color: var(--blue); cursor: pointer; }
    .trim-row.aud input[type=range] { accent-color: var(--amber); }

    /* Fades */
    .fade-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .fade-input { display: flex; flex-direction: column; gap: 3px; }
    .fade-input label { font-size: 0.68rem; color: var(--muted); }
    .fade-input input {
      background: #0a0a14;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 0.82rem;
      width: 100%;
    }
    .fade-input input:focus { outline: none; border-color: var(--blue); }

    /* Transition card */
    .trans-card {
      margin: 0 0 2px 20px;
      background: rgba(254,202,87,0.04);
      border: 1px dashed rgba(254,202,87,0.2);
      border-radius: 8px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.8rem;
      color: var(--muted);
      flex-wrap: wrap;
    }
    .trans-label { color: var(--amber); font-size: 0.75rem; }
    .trans-card select, .trans-card input[type=number] {
      background: #0a0a14;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
    }
    .trans-card select:focus, .trans-card input:focus { outline: none; border-color: var(--amber); }
    .trans-card input[type=number] { width: 58px; }

    /* Preview section */
    #previewSection {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: none;
    }
    #previewSection.show { display: block; }
    .preview-hdr {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: rgba(0,0,0,0.2);
      border-bottom: 1px solid var(--border);
    }
    .preview-hdr span { font-size: 0.85rem; color: var(--amber); }
    .preview-hdr button {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.1rem;
      cursor: pointer;
    }
    .preview-hdr button:hover { color: #fff; }
    #previewVideo { width: 100%; max-height: 55vh; display: block; background: #000; }
    .preview-info {
      padding: 10px 16px;
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      gap: 16px;
    }
    .preview-info b { color: var(--amber); }

    /* Sticky bottom bar */
    .bottom-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(10,10,18,0.92);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 12px 24px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bottom-bar-inner {
      max-width: 960px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .progress-wrap {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      display: none;
    }
    .progress-wrap.show { display: block; }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--red), var(--amber));
      width: 0%;
      transition: width 0.3s;
    }

    #statusLog {
      height: 72px;
      background: #06060e;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.5;
      white-space: pre-wrap;
    }
    #statusLog .ok { color: var(--green); }
    #statusLog .err { color: var(--red); }
    #statusLog .info { color: var(--blue); }
    #statusLog .warn { color: var(--amber); }

    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .clip-count { font-size: 0.75rem; color: var(--muted); flex: 1; }
    .btn {
      padding: 9px 18px;
      border: none;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.15s;
    }
    .btn:hover:not(:disabled) { opacity: 0.88; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-clear { background: var(--bg3); color: #aaa; border: 1px solid var(--border); }
    .btn-preview { background: linear-gradient(90deg, #339af0, #4dabf7); color: #fff; }
    .btn-merge { background: linear-gradient(90deg, #ff6b6b, #feca57); color: #0a0a12; font-size: 0.9rem; }

    /* Download link */
    .dl-link {
      display: inline-block;
      margin-top: 6px;
      padding: 7px 18px;
      background: var(--green);
      color: #0a0a12;
      text-decoration: none;
      border-radius: 7px;
      font-weight: 700;
      font-size: 0.85rem;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal.show { display: flex; }
    .modal-inner {
      background: #1a1a2e;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-width: 860px;
      width: 100%;
      overflow: hidden;
    }
    .modal-hdr {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .modal-hdr h3 { font-size: 0.9rem; color: #fff; }
    .modal-hdr button {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.2rem;
      cursor: pointer;
    }
    .modal-hdr button:hover { color: #fff; }
    #modalVideo { width: 100%; max-height: 60vh; background: #000; display: block; }

    /* SVG icons (inline) */
    .icon-svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>

<header>
  <div id="ffmpegBar"></div>
  <h1>Advanced MP4 Joiner</h1>
  <p>Client-side video stitching via FFmpeg.wasm — no upload, no server</p>
</header>

<main>
  <!-- Drop zone -->
  <div class="drop-zone" id="dropZone">
    <div class="icon">🎬</div>
    <p><strong>Drop MP4 files here</strong><br><small>or click to browse — files never leave your device</small></p>
  </div>
  <input type="file" id="fileInput" multiple accept=".mp4,video/mp4">

  <!-- Clips -->
  <div id="clipsArea"></div>

  <!-- Preview section -->
  <div id="previewSection">
    <div class="preview-hdr">
      <span>Preview (draft quality)</span>
      <button onclick="closePreview()" title="Close">✕</button>
    </div>
    <video id="previewVideo" controls></video>
    <div class="preview-info">
      <span>Clips: <b id="prevCount">0</b></span>
      <span>Duration: <b id="prevDur">0:00</b></span>
    </div>
  </div>
</main>

<!-- Sticky bottom bar -->
<div class="bottom-bar">
  <div class="bottom-bar-inner">
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div id="statusLog"><span class="info">Ready. Drop MP4 files to begin.</span></div>
    <div class="actions">
      <span class="clip-count" id="clipCount">0 clips</span>
      <button class="btn btn-clear" id="btnClear">
        <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 .49-3.42"></path></svg>
        Clear
      </button>
      <button class="btn btn-preview" id="btnPreview" disabled>
        <svg class="icon-svg" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        Preview
      </button>
      <button class="btn btn-merge" id="btnMerge" disabled>
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Merge &amp; Download
      </button>
    </div>
  </div>
</div>

<!-- Clip modal -->
<div class="modal" id="clipModal" onclick="closeModal(event)">
  <div class="modal-inner">
    <div class="modal-hdr">
      <h3 id="modalTitle">Clip</h3>
      <button onclick="closeModal()">✕</button>
    </div>
    <video id="modalVideo" controls></video>
  </div>
</div>

<script type="module">
  import { FFmpeg } from 'https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js';
  import { fetchFile, toBlobURL } from 'https://unpkg.com/@ffmpeg/util@0.12.1/dist/esm/index.js';

  // ── State ──────────────────────────────────────────────────────────────────
  let clips = [];
  let transitions = [];
  let ffmpeg = null;
  let ffmpegLoading = false;
  let isProcessing = false;
  let uidCounter = 0;
  const uid = () => ++uidCounter;

  // ── DOM refs ───────────────────────────────────────────────────────────────
  const dropZone       = document.getElementById('dropZone');
  const fileInput      = document.getElementById('fileInput');
  const clipsArea      = document.getElementById('clipsArea');
  const btnClear       = document.getElementById('btnClear');
  const btnPreview     = document.getElementById('btnPreview');
  const btnMerge       = document.getElementById('btnMerge');
  const statusLog      = document.getElementById('statusLog');
  const progressWrap   = document.getElementById('progressWrap');
  const progressFill   = document.getElementById('progressFill');
  const previewSection = document.getElementById('previewSection');
  const previewVideo   = document.getElementById('previewVideo');
  const prevCount      = document.getElementById('prevCount');
  const prevDur        = document.getElementById('prevDur');
  const clipCount      = document.getElementById('clipCount');
  const ffmpegBar      = document.getElementById('ffmpegBar');
  const clipModal      = document.getElementById('clipModal');
  const modalVideo     = document.getElementById('modalVideo');
  const modalTitle     = document.getElementById('modalTitle');

  // ── Logging ────────────────────────────────────────────────────────────────
  function log(msg, type = 'info') {
    const span = document.createElement('span');
    span.className = type;
    span.textContent = msg + '\n';
    statusLog.appendChild(span);
    statusLog.scrollTop = statusLog.scrollHeight;
  }
  function clearLog() { statusLog.innerHTML = ''; }

  // ── Progress ───────────────────────────────────────────────────────────────
  function setProgress(pct) {
    progressWrap.classList.add('show');
    progressFill.style.width = pct + '%';
  }
  function hideProgress() {
    setTimeout(() => progressWrap.classList.remove('show'), 400);
  }

  // ── Time formatting ────────────────────────────────────────────────────────
  function fmt(sec) {
    const m = Math.floor(sec / 60);
    const s = (sec % 60).toFixed(1).padStart(4, '0');
    return `${m}:${s}`;
  }
  function fmtShort(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  // ── Thumbnail ──────────────────────────────────────────────────────────────
  function generateThumb(file) {
    return new Promise((resolve) => {
      const v = document.createElement('video');
      v.preload = 'metadata'; v.muted = true; v.playsInline = true;
      const url = URL.createObjectURL(file);
      v.src = url;
      v.onloadedmetadata = () => { v.currentTime = Math.min(1, v.duration / 2); };
      v.onseeked = () => {
        const c = document.createElement('canvas');
        c.width = 160; c.height = 90;
        c.getContext('2d').drawImage(v, 0, 0, 160, 90);
        URL.revokeObjectURL(url);
        resolve({ thumb: c.toDataURL('image/jpeg', 0.65), duration: v.duration });
      };
      v.onerror = () => { URL.revokeObjectURL(url); resolve({ thumb: null, duration: 0 }); };
    });
  }

  // ── File handling ──────────────────────────────────────────────────────────
  dropZone.onclick = () => fileInput.click();
  dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('dragover'); };
  dropZone.ondragleave = () => dropZone.classList.remove('dragover');
  dropZone.ondrop = (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); handleFiles(e.dataTransfer.files); };
  fileInput.onchange = (e) => handleFiles(e.target.files);

  async function handleFiles(list) {
    let added = 0;
    for (const f of list) {
      if (!f.name.toLowerCase().endsWith('.mp4')) continue;
      if (clips.some(c => c.file.name === f.name && c.file.size === f.size)) continue;
      const id = uid();
      const placeholder = { id, file: f, thumb: null, duration: 0, vStart: 0, vEnd: 0, aStart: 0, aEnd: 0, split: false, vFadeIn: 0, vFadeOut: 0, aFadeIn: 0, aFadeOut: 0 };
      clips.push(placeholder);
      if (clips.length > 1) transitions.push({ id: uid(), type: 'cut', duration: 0.5 });
      added++;
      generateThumb(f).then(({ thumb, duration }) => {
        const c = clips.find(x => x.id === id);
        if (!c) return;
        c.thumb = thumb;
        c.duration = duration;
        c.vEnd = duration;
        c.aEnd = duration;
        render();
      });
    }
    if (added) {
      render();
      clearLog();
      log(`Added ${added} file(s). Tip: FFmpeg loads on first Preview/Merge (~25 MB).`, 'ok');
      if (!ffmpeg && !ffmpegLoading) initFFmpeg().catch(() => {});
    }
  }

  // ── FFmpeg init ────────────────────────────────────────────────────────────
  async function initFFmpeg() {
    if (ffmpeg) return;
    if (ffmpegLoading) {
      while (ffmpegLoading) await new Promise(r => setTimeout(r, 200));
      if (ffmpeg) return;
      throw new Error('Previous FFmpeg load failed');
    }
    ffmpegLoading = true;
    clearLog();
    log('Loading FFmpeg.wasm (~25 MB)…', 'info');
    setProgress(5);
    ffmpegBar.classList.add('active');

    const ff = new FFmpeg();
    const base = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm';
    try {
      log('Downloading core…', 'info');
      const coreURL   = await toBlobURL(`${base}/ffmpeg-core.js`,        'text/javascript');
      setProgress(18);
      log('Downloading WASM…', 'info');
      const wasmURL   = await toBlobURL(`${base}/ffmpeg-core.wasm`,      'application/wasm');
      setProgress(32);
      log('Downloading worker…', 'info');
      const workerURL = await toBlobURL(`${base}/ffmpeg-core.worker.js`, 'text/javascript');
      setProgress(40);
      log('Initialising…', 'info');
      await ff.load({ coreURL, wasmURL, workerURL });
      ffmpeg = ff;
      ffmpegLoading = false;
      setProgress(100);
      hideProgress();
      ffmpegBar.classList.remove('active');
      clearLog();
      log('FFmpeg ready!', 'ok');
      updateButtons();
    } catch (e) {
      ffmpegLoading = false;
      ffmpeg = null;
      ffmpegBar.classList.remove('active');
      log('Failed to load FFmpeg: ' + e.message, 'err');
      if (e.message.includes('fetch')) {
        log('Check your internet connection. FFmpeg files are fetched from unpkg.com.', 'warn');
      }
      throw e;
    }
  }

  // ── Filter builder ─────────────────────────────────────────────────────────
  function buildFilters() {
    let vFilters = '', aFilters = '', vConcat = '', aConcat = '';
    let vCount = 0, aCount = 0, totalDur = 0;

    for (let i = 0; i < clips.length; i++) {
      const d = clips[i];
      const dur = d.duration;
      const vs = Math.max(0, d.vStart), ve = Math.min(dur, d.vEnd);
      const as = Math.max(0, d.aStart), ae = Math.min(dur, d.aEnd);
      const vLen = ve - vs, aLen = ae - as;

      if (vLen > 0.1) {
        let vf = `[${i}:v]trim=start=${vs}:end=${ve},setpts=PTS-STARTPTS`;
        if (d.vFadeIn  > 0) vf += `,fade=in:st=0:d=${Math.min(d.vFadeIn,  vLen/2)}:alpha=1`;
        if (d.vFadeOut > 0) vf += `,fade=out:st=${Math.max(0, vLen - d.vFadeOut)}:d=${Math.min(d.vFadeOut, vLen/2)}:alpha=1`;
        vf += `[cv${i}];`;
        vFilters += vf; vConcat += `[cv${i}]`; vCount++; totalDur += vLen;
      }
      if (aLen > 0.1) {
        let af = `[${i}:a]atrim=start=${as}:end=${ae},asetpts=PTS-STARTPTS`;
        if (d.aFadeIn  > 0) af += `,afade=in:st=0:d=${Math.min(d.aFadeIn,  aLen/2)}`;
        if (d.aFadeOut > 0) af += `,afade=out:st=${Math.max(0, aLen - d.aFadeOut)}:d=${Math.min(d.aFadeOut, aLen/2)}`;
        af += `[ca${i}];`;
        aFilters += af; aConcat += `[ca${i}]`; aCount++;
      }
    }

    if (vCount === 0 && aCount === 0) throw new Error('No valid clips after trimming.');
    let out = vFilters + aFilters;
    if (vCount > 0) out += `${vConcat}concat=n=${vCount}:v=1:a=0[outv];`;
    if (aCount > 0) out += `${aConcat}concat=n=${aCount}:v=0:a=1[outa];`;
    return { filterComplex: out, vCount, aCount, totalDur };
  }

  // ── Main process ───────────────────────────────────────────────────────────
  async function runProcess(previewMode) {
    if (clips.length < 1) { log('Add at least one clip.', 'err'); return; }
    if (isProcessing) return;
    isProcessing = true;
    const btn = previewMode ? btnPreview : btnMerge;
    const origText = btn.innerHTML;
    btn.disabled = true;
    btn.textContent = previewMode ? '⏳ Building…' : '⏳ Merging…';
    btnPreview.disabled = btnMerge.disabled = true;

    try {
      await initFFmpeg();
      clearLog();
      log(`Writing ${clips.length} file(s) to virtual FS…`, 'info');
      setProgress(0);

      for (let i = 0; i < clips.length; i++) {
        const data = await fetchFile(clips[i].file);
        await ffmpeg.writeFile(`in${i}.mp4`, data);
        setProgress(Math.round((i + 1) / clips.length * 15));
        log(`  Wrote in${i}.mp4`, 'info');
      }

      const { filterComplex, vCount, aCount, totalDur } = buildFilters();
      log(`Running FFmpeg (${vCount}v + ${aCount}a tracks)…`, 'info');
      setProgress(20);

      const outName = previewMode ? 'preview.mp4' : 'output.mp4';
      const args = [
        '-y',
        ...clips.flatMap((_, i) => ['-i', `in${i}.mp4`]),
        '-filter_complex', filterComplex,
        ...(vCount > 0 ? ['-map', '[outv]'] : []),
        ...(aCount > 0 ? ['-map', '[outa]'] : []),
        '-c:v', 'libx264',
        '-preset', previewMode ? 'ultrafast' : 'fast',
        '-crf',   previewMode ? '32' : '23',
        ...(previewMode ? ['-vf', 'scale=480:-2'] : []),
        '-c:a', 'aac',
        '-b:a', previewMode ? '96k' : '128k',
        '-movflags', '+faststart',
        outName,
      ];

      ffmpeg.on('progress', ({ progress }) => {
        setProgress(20 + Math.round(progress * 75));
      });

      const code = await ffmpeg.exec(args);
      if (code !== 0) throw new Error(`FFmpeg exited with code ${code}`);

      const data = await ffmpeg.readFile(outName);
      const blob = new Blob([data.buffer], { type: 'video/mp4' });
      const url  = URL.createObjectURL(blob);

      // Cleanup FS
      for (let i = 0; i < clips.length; i++) await ffmpeg.deleteFile(`in${i}.mp4`).catch(() => {});
      await ffmpeg.deleteFile(outName).catch(() => {});

      setProgress(100);

      if (previewMode) {
        previewVideo.src = url;
        prevCount.textContent = vCount;
        prevDur.textContent = fmtShort(totalDur);
        previewSection.classList.add('show');
        setTimeout(() => previewSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 80);
        clearLog();
        log('Preview ready! Scroll down to watch.', 'ok');
      } else {
        clearLog();
        log('Done! Click the link below to download.', 'ok');
        const a = document.createElement('a');
        a.href = url;
        a.download = 'merged_video.mp4';
        a.className = 'dl-link';
        a.textContent = '⬇ Download merged_video.mp4';
        statusLog.appendChild(document.createElement('br'));
        statusLog.appendChild(a);
      }

      hideProgress();
    } catch (err) {
      clearLog();
      log((previewMode ? 'Preview' : 'Merge') + ' failed: ' + (err.message || String(err)), 'err');
      hideProgress();
    } finally {
      isProcessing = false;
      btn.innerHTML = origText;
      updateButtons();
    }
  }

  // ── Clip management ────────────────────────────────────────────────────────
  window.moveClip = (id, dir) => {
    const idx = clips.findIndex(c => c.id === id);
    const n = idx + dir;
    if (n < 0 || n >= clips.length) return;
    [clips[idx], clips[n]] = [clips[n], clips[idx]];
    render();
  };

  window.removeClip = (id) => {
    const idx = clips.findIndex(c => c.id === id);
    clips.splice(idx, 1);
    if (transitions.length >= clips.length) transitions.splice(Math.max(0, idx - 1), 1);
    render();
  };

  window.openClipModal = (id) => {
    const clip = clips.find(c => c.id === id);
    if (!clip) return;
    const url = URL.createObjectURL(clip.file);
    modalVideo.src = url;
    modalTitle.textContent = clip.file.name;
    clipModal.classList.add('show');
  };

  window.closeModal = (e) => {
    if (e && e.target !== clipModal) return;
    clipModal.classList.remove('show');
    modalVideo.pause();
    URL.revokeObjectURL(modalVideo.src);
    modalVideo.src = '';
  };
  document.getElementById('clipModal').querySelector('button').onclick = () => window.closeModal();

  window.closePreview = () => {
    previewSection.classList.remove('show');
    previewVideo.pause();
    URL.revokeObjectURL(previewVideo.src);
    previewVideo.src = '';
  };

  // ── Clear ──────────────────────────────────────────────────────────────────
  btnClear.onclick = () => {
    clips = []; transitions = [];
    window.closePreview();
    render();
    clearLog();
    log('Cleared.', 'info');
  };

  btnPreview.onclick = () => runProcess(true);
  btnMerge.onclick   = () => runProcess(false);

  // ── Render ─────────────────────────────────────────────────────────────────
  function updateButtons() {
    const hasClips = clips.length > 0;
    const ready    = !!ffmpeg && !isProcessing;
    btnClear.disabled   = isProcessing;
    btnPreview.disabled = !hasClips || !ready;
    btnMerge.disabled   = !hasClips || !ready;
    // If FFmpeg not loaded yet, still allow clicking (init fires inside runProcess)
    if (hasClips && !ffmpeg && !isProcessing) {
      btnPreview.disabled = false;
      btnMerge.disabled   = false;
    }
    clipCount.textContent = `${clips.length} clip${clips.length !== 1 ? 's' : ''}${clips.length > 0 ? ` · ~${clips.reduce((a,c)=>a+(c.vEnd-c.vStart),0).toFixed(1)}s` : ''}`;
  }

  function render() {
    clipsArea.innerHTML = '';
    updateButtons();

    clips.forEach((clip, idx) => {
      const dur  = clip.duration || 0;
      const vs   = clip.vStart, ve = clip.vEnd || dur;
      const as   = clip.aStart, ae = clip.aEnd || dur;
      const vL   = dur ? (vs/dur*100).toFixed(1) : 0;
      const vW   = dur ? ((ve-vs)/dur*100).toFixed(1) : 100;
      const aL   = dur ? (as/dur*100).toFixed(1) : 0;
      const aW   = dur ? ((ae-as)/dur*100).toFixed(1) : 100;

      // ── clip card ──────────────────────────────────────────────────
      const card = document.createElement('div');
      card.className = 'clip-card';
      card.innerHTML = `
        <div class="clip-header">
          <div class="clip-thumb" onclick="openClipModal(${clip.id})">
            ${clip.thumb
              ? `<img src="${clip.thumb}" alt="">`
              : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#333;font-size:1.3rem;">🎬</div>`}
            <div class="play-ovr">▶</div>
          </div>
          <div class="clip-title"><span class="clip-num">#${idx+1}</span>${escHtml(clip.file.name)}</div>
          <div class="clip-ctrls">
            <button ${idx===0?'disabled':''} onclick="moveClip(${clip.id},-1)" title="Move up">↑</button>
            <button ${idx===clips.length-1?'disabled':''} onclick="moveClip(${clip.id},1)" title="Move down">↓</button>
            <button class="del" onclick="removeClip(${clip.id})" title="Remove">✕</button>
          </div>
        </div>
        <div class="clip-body">
          <div class="tl-bar" title="Blue = video trim  ·  Yellow = audio trim">
            <div class="tl-seg vid" style="left:${vL}%;width:${vW}%"></div>
            <div class="tl-seg aud" style="left:${aL}%;width:${aW}%"></div>
            <div class="tl-hint">${fmtShort(ve-vs)} / ${fmtShort(ae-as)}</div>
          </div>
          <div class="split-toggle">
            <input type="checkbox" id="split_${clip.id}" ${clip.split?'checked':''}>
            <label for="split_${clip.id}">Split audio/video trim</label>
          </div>
          <div class="trim-grid ${clip.split?'split4':'merged'}" id="trimGrid_${clip.id}">
            ${clip.split ? `
              <div class="trim-row">
                <label>Video Start <span class="val">${fmt(vs)}</span></label>
                <input type="range" id="vs_${clip.id}" min="0" max="${dur}" step="0.05" value="${vs}">
              </div>
              <div class="trim-row">
                <label>Video End <span class="val">${fmt(ve)}</span></label>
                <input type="range" id="ve_${clip.id}" min="0" max="${dur}" step="0.05" value="${ve}">
              </div>
              <div class="trim-row aud">
                <label>Audio Start <span class="val">${fmt(as)}</span></label>
                <input type="range" id="as_${clip.id}" min="0" max="${dur}" step="0.05" value="${as}">
              </div>
              <div class="trim-row aud">
                <label>Audio End <span class="val">${fmt(ae)}</span></label>
                <input type="range" id="ae_${clip.id}" min="0" max="${dur}" step="0.05" value="${ae}">
              </div>
            ` : `
              <div class="trim-row">
                <label>Start <span class="val">${fmt(vs)}</span></label>
                <input type="range" id="s_${clip.id}" min="0" max="${dur}" step="0.05" value="${vs}">
              </div>
              <div class="trim-row">
                <label>End <span class="val">${fmt(ve)}</span></label>
                <input type="range" id="e_${clip.id}" min="0" max="${dur}" step="0.05" value="${ve}">
              </div>
            `}
          </div>
          <div class="fade-row">
            <div class="fade-input"><label>Video Fade In (s)</label><input type="number" id="vfi_${clip.id}" min="0" max="5" step="0.1" value="${clip.vFadeIn}"></div>
            <div class="fade-input"><label>Video Fade Out (s)</label><input type="number" id="vfo_${clip.id}" min="0" max="5" step="0.1" value="${clip.vFadeOut}"></div>
            <div class="fade-input"><label>Audio Fade In (s)</label><input type="number" id="afi_${clip.id}" min="0" max="5" step="0.1" value="${clip.aFadeIn}"></div>
            <div class="fade-input"><label>Audio Fade Out (s)</label><input type="number" id="afo_${clip.id}" min="0" max="5" step="0.1" value="${clip.aFadeOut}"></div>
          </div>
        </div>
      `;
      clipsArea.appendChild(card);

      // Wire split toggle
      card.querySelector(`#split_${clip.id}`).onchange = (e) => {
        clip.split = e.target.checked;
        render();
      };

      // Wire trim sliders
      if (clip.split) {
        const vsEl = card.querySelector(`#vs_${clip.id}`);
        const veEl = card.querySelector(`#ve_${clip.id}`);
        const asEl = card.querySelector(`#as_${clip.id}`);
        const aeEl = card.querySelector(`#ae_${clip.id}`);
        const bind = (el, key, limKey, limFn) => {
          el.oninput = () => {
            const v = parseFloat(el.value);
            el.previousElementSibling?.querySelector('.val') && (el.parentElement.querySelector('.val').textContent = fmt(v));
            clip[key] = v;
            if (limKey && limFn(v, parseFloat(card.querySelector(`#${limKey}_${clip.id}`)?.value||0))) {
              card.querySelector(`#${limKey}_${clip.id}`).value = v;
              clip[limKey.split('_')[0] === 'vs' ? 've' : limKey.split('_')[0]] = v;
            }
            refreshTL(clip, card, dur);
          };
        };
        vsEl.oninput = () => { clip.vStart = +vsEl.value; if(clip.vStart > clip.vEnd) { clip.vEnd = clip.vStart; veEl.value = veEl.value; } vsEl.parentElement.querySelector('.val').textContent = fmt(clip.vStart); refreshTL(clip,card,dur); };
        veEl.oninput = () => { clip.vEnd   = +veEl.value; if(clip.vEnd < clip.vStart) { clip.vStart = clip.vEnd; vsEl.value = vsEl.value; } veEl.parentElement.querySelector('.val').textContent = fmt(clip.vEnd);   refreshTL(clip,card,dur); };
        asEl.oninput = () => { clip.aStart = +asEl.value; if(clip.aStart > clip.aEnd) { clip.aEnd = clip.aStart; aeEl.value = aeEl.value; } asEl.parentElement.querySelector('.val').textContent = fmt(clip.aStart); refreshTL(clip,card,dur); };
        aeEl.oninput = () => { clip.aEnd   = +aeEl.value; if(clip.aEnd < clip.aStart) { clip.aStart = clip.aEnd; asEl.value = asEl.value; } aeEl.parentElement.querySelector('.val').textContent = fmt(clip.aEnd);   refreshTL(clip,card,dur); };
      } else {
        const sEl = card.querySelector(`#s_${clip.id}`);
        const eEl = card.querySelector(`#e_${clip.id}`);
        sEl.oninput = () => {
          const v = +sEl.value;
          clip.vStart = clip.aStart = v;
          if (v > clip.vEnd) { clip.vEnd = clip.aEnd = v; eEl.value = v; }
          sEl.parentElement.querySelector('.val').textContent = fmt(v);
          refreshTL(clip, card, dur);
        };
        eEl.oninput = () => {
          const v = +eEl.value;
          clip.vEnd = clip.aEnd = v;
          if (v < clip.vStart) { clip.vStart = clip.aStart = v; sEl.value = v; }
          eEl.parentElement.querySelector('.val').textContent = fmt(v);
          refreshTL(clip, card, dur);
        };
      }

      // Wire fade inputs
      [['vfi', 'vFadeIn'], ['vfo', 'vFadeOut'], ['afi', 'aFadeIn'], ['afo', 'aFadeOut']].forEach(([prefix, key]) => {
        const el = card.querySelector(`#${prefix}_${clip.id}`);
        if (el) el.onchange = () => { clip[key] = parseFloat(el.value) || 0; };
      });

      // ── transition card between clips ──────────────────────────────
      if (idx < clips.length - 1) {
        const t = transitions[idx] || { id: uid(), type: 'cut', duration: 0.5 };
        transitions[idx] = t;
        const tc = document.createElement('div');
        tc.className = 'trans-card';
        tc.innerHTML = `
          <span class="trans-label">↳ Between #${idx+1} &amp; #${idx+2}:</span>
          <select id="tt_${t.id}">
            <option value="cut"   ${t.type==='cut'   ?'selected':''}>Hard Cut</option>
            <option value="vfade" ${t.type==='vfade' ?'selected':''}>Video Crossfade</option>
            <option value="afade" ${t.type==='afade' ?'selected':''}>Audio Crossfade</option>
            <option value="both"  ${t.type==='both'  ?'selected':''}>Both Crossfade</option>
          </select>
          <span style="display:flex;align-items:center;gap:6px;">
            <span>Duration:</span>
            <input type="number" id="td_${t.id}" min="0.1" max="3" step="0.1" value="${t.duration}">
            <span>sec</span>
          </span>
        `;
        clipsArea.appendChild(tc);
        tc.querySelector(`#tt_${t.id}`).onchange = e => { t.type = e.target.value; };
        tc.querySelector(`#td_${t.id}`).onchange = e => { t.duration = parseFloat(e.target.value) || 0.5; };
      }
    });
  }

  function refreshTL(clip, card, dur) {
    const vs = clip.vStart, ve = clip.vEnd || dur;
    const as = clip.aStart, ae = clip.aEnd || dur;
    const vSeg = card.querySelector('.tl-seg.vid');
    const aSeg = card.querySelector('.tl-seg.aud');
    const hint = card.querySelector('.tl-hint');
    if (dur > 0) {
      vSeg.style.left  = (vs/dur*100).toFixed(1) + '%';
      vSeg.style.width = ((ve-vs)/dur*100).toFixed(1) + '%';
      aSeg.style.left  = (as/dur*100).toFixed(1) + '%';
      aSeg.style.width = ((ae-as)/dur*100).toFixed(1) + '%';
    }
    hint.textContent = `${fmtShort(ve-vs)} / ${fmtShort(ae-as)}`;
    // update total in button bar
    clipCount.textContent = `${clips.length} clip${clips.length!==1?'s':''}${clips.length>0?` · ~${clips.reduce((a,c)=>a+(c.vEnd-c.vStart),0).toFixed(1)}s`:''}`;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  render();
</script>
</body>
</html>
