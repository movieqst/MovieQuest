<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Movie Quest Canada</title>
<!-- Every item has its own page now: movies/<id>/ (built by tools/build.mjs).
     Old links -- item.html?id=... -- land here and are sent on. -->
<script>
  (function () {
    var id = new URLSearchParams(location.search).get('id');
    location.replace(id ? 'movies/' + encodeURIComponent(id) + '/' : './');
  })();
</script>
</head>
<body style="font-family:sans-serif;padding:40px;text-align:center;">
  <p>This page has moved. <a href="./">Back to the catalogue</a></p>
</body>
</html>
