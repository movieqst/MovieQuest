<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Item — Movie Quest Canada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#131211;
    --paper:#FAF8F3;
    --card:#F1ECE0;
    --red:#C8102E;
    --red-dark:#98081F;
    --stone:#8C8578;
    --line:#E1DACB;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{color:inherit;}

  /* ---------- Header / Marquee ---------- */
  header{
    background:var(--ink);
    color:var(--paper);
    padding:18px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    flex-wrap:wrap;
    border-bottom:6px solid var(--red);
  }
  .wordmark{
    font-family:'Anton',sans-serif;
    font-size:clamp(1.6rem,3.2vw,2.4rem);
    letter-spacing:1px;
    display:flex;
    align-items:baseline;
    gap:10px;
    text-decoration:none;
  }
  .wordmark span{color:var(--red);}
  .header-right{
    display:flex;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
  }
  .search-wrap{
    position:relative;
  }
  #searchInput{
    background:#1f1e1c;
    border:1px solid #3a3833;
    color:var(--paper);
    font-family:'JetBrains Mono',monospace;
    font-size:0.9rem;
    padding:10px 14px 10px 34px;
    border-radius:4px;
    width:220px;
    outline:none;
  }
  #searchInput::placeholder{color:#8a877e;}
  .search-wrap::before{
    content:"⌕";
    position:absolute;
    left:12px; top:50%;
    transform:translateY(-50%);
    color:#8a877e;
    font-size:1.1rem;
  }
  .store-link{
    font-family:'JetBrains Mono',monospace;
    font-size:0.8rem;
    font-weight:700;
    letter-spacing:0.5px;
    text-transform:uppercase;
    background:var(--red);
    color:var(--paper);
    padding:10px 16px;
    border-radius:4px;
    text-decoration:none;
    white-space:nowrap;
    transition:background 0.15s;
  }
  .store-link:hover{background:var(--red-dark);}

  /* ---------- Category strip (film-reel nav) ---------- */
  .reel-nav{
    background:var(--ink);
    padding:0 20px 14px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    border-bottom:1px solid #2a2925;
  }
  .reel-tab{
    font-family:'JetBrains Mono',monospace;
    font-size:0.78rem;
    font-weight:700;
    letter-spacing:0.4px;
    text-transform:uppercase;
    color:#c9c4b8;
    background:#1f1e1c;
    border:1px solid #34322d;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    transition:all 0.15s;
    position:relative;
    text-decoration:none;
    display:inline-block;
  }
  .reel-tab::before{
    content:"○";
    color:#514f48;
    margin-right:6px;
    font-size:0.7rem;
  }
  .reel-tab:hover{ border-color:var(--red); color:var(--paper); }
  .reel-tab.active{
    background:var(--red);
    border-color:var(--red);
    color:var(--paper);
  }
  .reel-tab.active::before{ color:var(--paper); }

  .year-strip{
    background:#0f0e0d;
    padding:12px 20px;
    display:none;
    gap:6px;
    flex-wrap:wrap;
  }
  .year-strip.visible{ display:flex; }
  .year-chip{
    font-family:'JetBrains Mono',monospace;
    font-size:0.75rem;
    font-weight:500;
    color:#a29d90;
    background:transparent;
    border:1px solid #2f2d28;
    padding:5px 11px;
    border-radius:3px;
    cursor:pointer;
    transition:all 0.15s;
    text-decoration:none;
    display:inline-block;
  }
  .year-chip:hover{ color:var(--paper); border-color:var(--stone); }
  .year-chip.active{
    color:var(--ink);
    background:var(--paper);
    border-color:var(--paper);
  }

  .container{
    max-width:1360px;
    margin:0 auto;
    padding:30px 24px 60px;
  }
  .back-link{
    display:inline-block;
    margin-bottom:20px;
    color:var(--stone);
    text-decoration:none;
    font-family:'JetBrains Mono',monospace;
    font-size:0.85rem;
    font-weight:700;
  }
  .back-link:hover{ color:var(--red); }

  .detail-layout{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:16px;
  }

  .flank{
    width:120px;
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    text-decoration:none;
    color:var(--ink);
    background:var(--card);
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 2px 0 var(--line);
    transition:transform 0.15s, box-shadow 0.15s;
  }
  .flank:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(0,0,0,0.15);
  }
  .flank-poster{
    aspect-ratio:5/7;
    background:#e5ded0;
    overflow:hidden;
  }
  .flank-poster img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .flank-label{
    font-family:'JetBrains Mono',monospace;
    font-size:0.62rem;
    font-weight:700;
    letter-spacing:0.6px;
    text-transform:uppercase;
    color:var(--red);
    padding:8px 10px 0;
  }
  .flank-title{
    font-size:0.78rem;
    font-weight:700;
    line-height:1.25;
    padding:3px 10px 10px;
  }
  .flank.next{ text-align:right; }
  .flank.next .flank-label{ text-align:right; }

  .flank-far{
    width:90px;
    opacity:0.68;
  }
  .flank-far:hover{ opacity:1; }
  .flank-far .flank-title{
    padding-top:10px;
    font-size:0.7rem;
  }

  .detail{
    background:var(--card);
    border-radius:10px;
    overflow:hidden;
    display:grid;
    grid-template-columns:300px 1fr;
    box-shadow:0 8px 30px rgba(0,0,0,0.1);
    flex:1 1 auto;
    min-width:0;
    max-width:820px;
  }
  .poster-wrap{
    position:relative;
    background:#e5ded0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .poster-wrap img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .format-tag{
    position:absolute;
    top:0; right:0;
    background:var(--red);
    color:var(--paper);
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:0.75rem;
    letter-spacing:0.5px;
    padding:7px 14px 7px 18px;
    clip-path:polygon(18px 0, 100% 0, 100% 100%, 0 100%);
    z-index:5;
  }

  /* Image carousel arrows */
  .img-nav{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:rgba(19,18,17,0.7);
    color:var(--paper);
    border:none;
    width:38px;
    height:38px;
    border-radius:50%;
    cursor:pointer;
    font-size:20px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:10;
    transition:background 0.15s;
    padding-bottom:2px;
  }
  .img-nav:hover{ background:rgba(19,18,17,0.95); }
  .img-nav:disabled{
    opacity:0.25;
    cursor:not-allowed;
  }
  .img-nav.prev{ left:8px; }
  .img-nav.next{ right:8px; }
  .img-counter{
    position:absolute;
    bottom:8px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(19,18,17,0.7);
    color:var(--paper);
    font-family:'JetBrains Mono',monospace;
    font-size:0.7rem;
    padding:4px 10px;
    border-radius:12px;
    z-index:10;
  }

  .info{
    padding:28px 32px;
    display:flex;
    flex-direction:column;
  }
  .item-title{
    font-family:'Anton',sans-serif;
    font-size:1.9rem;
    letter-spacing:0.5px;
    line-height:1.1;
    margin-bottom:6px;
  }
  .item-meta{
    font-family:'JetBrains Mono',monospace;
    color:var(--stone);
    font-size:0.9rem;
    margin-bottom:18px;
  }
  .item-desc{
    font-size:1rem;
    line-height:1.6;
    margin-bottom:24px;
  }
  .price-row{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:24px;
    padding-bottom:24px;
    border-bottom:1px dashed var(--line);
  }
  .price-value{
    font-family:'Anton',sans-serif;
    font-size:2rem;
    color:var(--red);
  }
  .price-label{
    font-family:'JetBrains Mono',monospace;
    font-size:0.8rem;
    color:var(--stone);
    text-transform:uppercase;
  }

  .cta-row{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-top:auto;
  }
  .cta-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:14px 20px;
    border-radius:6px;
    font-weight:700;
    font-size:1rem;
    text-decoration:none;
    text-align:center;
    transition:all 0.15s;
  }
  .cta-primary{
    background:var(--red);
    color:var(--paper);
  }
  .cta-primary:hover{ background:var(--red-dark); }
  .cta-secondary{
    background:transparent;
    color:var(--ink);
    border:1.5px solid var(--ink);
  }
  .cta-secondary:hover{ background:var(--ink); color:var(--paper); }

  /* ---------- Movie Details Box ---------- */
  .movie-details-box{
    background:var(--card);
    border-radius:10px;
    padding:24px 28px;
    margin-top:24px;
    box-shadow:0 2px 0 var(--line);
  }
  .movie-details-box h3{
    font-family:'Anton',sans-serif;
    font-size:1.1rem;
    letter-spacing:0.5px;
    color:var(--red);
    margin-bottom:16px;
  }
  .detail-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px 32px;
  }
  .detail-item{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .detail-item .label{
    font-family:'JetBrains Mono',monospace;
    font-size:0.65rem;
    font-weight:700;
    letter-spacing:0.5px;
    text-transform:uppercase;
    color:var(--stone);
  }
  .detail-item .value{
    font-size:0.95rem;
    line-height:1.4;
  }
  .detail-item .value .actor{
    display:inline-block;
  }
  .detail-item .value .actor:not(:last-child)::after{
    content:" • ";
    color:var(--stone);
  }

  /* ---------- YouTube Trailer ---------- */
  .trailer-box{
    margin-top:20px;
    border-radius:10px;
    overflow:hidden;
    background:var(--ink);
    position:relative;
    padding-bottom:56.25%;
    height:0;
  }
  .trailer-box iframe{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    border:0;
  }
  .trailer-placeholder{
    background:var(--ink);
    color:var(--stone);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'JetBrains Mono',monospace;
    font-size:0.9rem;
    padding:40px 20px;
    text-align:center;
    border-radius:10px;
    margin-top:20px;
  }

  /* ---------- Tidbits Section ---------- */
  .tidbits-section{
    margin-top:24px;
    background:var(--ink);
    color:var(--paper);
    border-radius:10px;
    padding:24px 28px;
  }
  .tidbits-title{
    font-family:'Anton',sans-serif;
    font-size:1.2rem;
    letter-spacing:0.5px;
    color:var(--red);
    margin-bottom:14px;
  }
  .tidbits-list{
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .tidbits-list li{
    padding-left:22px;
    position:relative;
    line-height:1.55;
    font-size:0.95rem;
    color:#e9e5db;
  }
  .tidbits-list li::before{
    content:"★";
    position:absolute;
    left:0; top:1px;
    color:var(--red);
    font-size:0.8rem;
  }

  .not-found{
    text-align:center;
    padding:80px 20px;
    color:var(--stone);
  }
  .not-found a{ color:var(--red); text-decoration:none; font-weight:700; }

  .hidden{ display:none !important; }

  @media (max-width:900px){
    .detail-layout{ flex-direction:column; }
    .flank{
      width:100%;
      flex-direction:row;
      align-items:center;
    }
    .flank-poster{
      width:64px;
      aspect-ratio:5/7;
      flex-shrink:0;
    }
    .flank-label{ padding:0 0 0 12px; }
    .flank-title{ padding:2px 12px 0 12px; }
    .flank.next{ text-align:left; flex-direction:row-reverse; }
    .flank.next .flank-label{ text-align:left; padding:0 12px 0 0; }
    .flank.next .flank-title{ text-align:right; padding:2px 12px 0 0; }
    .detail-grid{
      grid-template-columns:1fr;
      gap:10px;
    }
  }

  @media (max-width:640px){
    .detail{ grid-template-columns:1fr; }
    .poster-wrap{ aspect-ratio:5/7; }
    .info{ padding:22px; }
    .img-nav{ width:34px; height:34px; font-size:18px; }
    .movie-details-box{ padding:18px; }
  }
</style>
</head>
<body>

<header>
  <a class="wordmark" href="./">MOVIE QUEST<span>·</span>CANADA</a>
  <div class="header-right">
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Search titles...">
    </div>
    <a class="store-link" href="https://www.ebay.ca/str/moviequest?mkcid=1&mkrid=706-53473-19255-0&siteid=2&campid=5339133571&customid=header&toolid=10001&mkevt=1" target="_blank" rel="noopener">Visit eBay Store →</a>
  </div>
</header>

<nav class="reel-nav" id="reelNav"></nav>
<div class="year-strip" id="yearStrip"></div>

<div class="container">
  <a class="back-link" href="./">← BACK TO CATALOGUE</a>

  <div id="loading" class="not-found">Loading item…</div>

  <div id="not-found" class="not-found hidden">
    <p>Couldn't find that item in the catalogue.</p>
    <p style="margin-top:10px;"><a href="./">← Return to the catalogue</a></p>
  </div>

  <div id="detailLayout" class="detail-layout hidden">
    <a id="prevFlank2" class="flank flank-far prev hidden" href="#">
      <div class="flank-poster"><img id="prevFlank2Img" src="" alt=""></div>
      <div class="flank-title" id="prevFlank2Title"></div>
    </a>

    <a id="prevFlank1" class="flank prev hidden" href="#">
      <div class="flank-poster"><img id="prevFlank1Img" src="" alt=""></div>
      <div class="flank-label">← Previous</div>
      <div class="flank-title" id="prevFlank1Title"></div>
    </a>

    <div id="detail" class="detail">
      <div class="poster-wrap">
        <img id="poster" src="" alt="">
        <div class="format-tag" id="formatTag"></div>
        <button class="img-nav prev" id="imgPrev" aria-label="Previous image">‹</button>
        <button class="img-nav next" id="imgNext" aria-label="Next image">›</button>
        <div class="img-counter" id="imgCounter"></div>
      </div>
      <div class="info">
        <div class="item-title" id="title"></div>
        <div class="item-meta" id="meta"></div>
        <div class="item-desc" id="desc"></div>
        <div class="price-row">
          <div class="price-value" id="price"></div>
          <div class="price-label">from our store</div>
        </div>
        <div class="cta-row" id="ctaRow">
          <!-- Primary button: only shows if storeUrl exists -->
          <a class="cta-btn cta-primary hidden" id="storeLink" href="#" target="_blank" rel="noopener">View Movie Quest eBay Listing</a>
          <!-- Secondary button: always shows -->
          <a class="cta-btn cta-secondary" id="searchLink" href="#" target="_blank" rel="noopener">View ALL eBay Listings →</a>
        </div>
      </div>
    </div>

    <a id="nextFlank1" class="flank next hidden" href="#">
      <div class="flank-poster"><img id="nextFlank1Img" src="" alt=""></div>
      <div class="flank-label">Next →</div>
      <div class="flank-title" id="nextFlank1Title"></div>
    </a>

    <a id="nextFlank2" class="flank flank-far next hidden" href="#">
      <div class="flank-poster"><img id="nextFlank2Img" src="" alt=""></div>
      <div class="flank-title" id="nextFlank2Title"></div>
    </a>
  </div>

  <!-- Movie Details Box -->
  <div id="movieDetailsBox" class="movie-details-box hidden">
    <h3>🎬 Movie Details</h3>
    <div class="detail-grid" id="detailGrid"></div>
  </div>

  <!-- YouTube Trailer Embed -->
  <div id="trailerContainer"></div>

  <div id="tidbitsSection" class="tidbits-section hidden">
    <div class="tidbits-title">🎬 Did You Know?</div>
    <ul class="tidbits-list" id="tidbitsList"></ul>
  </div>
</div>

<script>
const CATEGORIES = [
  { code:'all',      label:'All' },
  { code:'pre1949',  label:'Pre-1949' },
  { code:'1950s',    label:'1950s' },
  { code:'1960s',    label:'1960s' },
  { code:'1970s',    label:'1970s' },
  { code:'1980s',    label:'1980s', years:[1980,1981,1982,1983,1984,1985,1986,1987,1988,1989] },
  { code:'1990s',    label:'1990s', years:[1990,1991,1992,1993,1994,1995,1996,1997,1998,1999] },
  { code:'2000s',    label:'2000s', years:[2000,2001,2002,2003,2004,2005,2006,2007,2008,2009] },
  { code:'2010s',    label:'2010s', years:[2010,2011,2012,2013,2014,2015,2016,2017,2018,2019] },
  { code:'2020s',    label:'2020s' },
  { code:'tvseries', label:'TV Series' },
  { code:'etc',      label:'ETC' },
  { code:'music',    label:'Music CDs' }
];

const reelNav = document.getElementById('reelNav');
const yearStrip = document.getElementById('yearStrip');
const searchInput = document.getElementById('searchInput');
let openCategory = null;

function buildReelNav(){
  reelNav.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const tab = document.createElement('a');
    tab.className = 'reel-tab' + (cat.code === openCategory ? ' active' : '');
    tab.textContent = cat.label;
    tab.href = `index.html?cat=${encodeURIComponent(cat.code)}`;
    if (cat.years){
      tab.addEventListener('click', (e) => {
        e.preventDefault();
        openCategory = (openCategory === cat.code) ? null : cat.code;
        buildReelNav();
        buildYearStrip();
      });
    }
    reelNav.appendChild(tab);
  });
}

function buildYearStrip(){
  const cat = CATEGORIES.find(c => c.code === openCategory);
  if (!cat || !cat.years){
    yearStrip.classList.remove('visible');
    yearStrip.innerHTML = '';
    return;
  }
  yearStrip.classList.add('visible');
  yearStrip.innerHTML = '';
  cat.years.forEach(y => {
    const chip = document.createElement('a');
    chip.className = 'year-chip';
    chip.textContent = y;
    chip.href = `index.html?cat=${encodeURIComponent(cat.code)}&year=${y}`;
    yearStrip.appendChild(chip);
  });
}

buildReelNav();
buildYearStrip();

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && searchInput.value.trim()){
    window.location.href = `index.html?q=${encodeURIComponent(searchInput.value.trim())}`;
  }
});

let currentImgIndex = 1;
let imgBaseUrl = '';
let totalImages = 1;

function initCarousel(imageUrl) {
  const match = imageUrl.match(/^(.*-)(\d+)(\.jpg)$/i);
  if (match) {
    imgBaseUrl = match[1];
    currentImgIndex = parseInt(match[2], 10);
  } else {
    imgBaseUrl = imageUrl.replace(/\.jpg$/i, '-');
    currentImgIndex = 1;
  }
  updateCounter();
  probeImages();
}

function probeImages() {
  let probeIndex = currentImgIndex + 1;
  function tryProbe() {
    const img = new Image();
    img.onload = () => {
      totalImages = probeIndex;
      probeIndex++;
      tryProbe();
    };
    img.onerror = () => {
      updateNavButtons();
    };
    img.src = imgBaseUrl + probeIndex + '.jpg';
  }
  tryProbe();
}

function changeImage(delta) {
  const newIndex = currentImgIndex + delta;
  if (newIndex < 1) return;

  const testImg = new Image();
  testImg.onload = () => {
    currentImgIndex = newIndex;
    if (currentImgIndex > totalImages) totalImages = currentImgIndex;
    document.getElementById('poster').src = testImg.src;
    updateNavButtons();
    updateCounter();
  };
  testImg.onerror = () => {
    if (delta > 0) {
      totalImages = currentImgIndex;
      updateNavButtons();
    }
  };
  testImg.src = imgBaseUrl + newIndex + '.jpg';
}

function updateNavButtons() {
  document.getElementById('imgPrev').disabled = currentImgIndex <= 1;
  document.getElementById('imgNext').disabled = currentImgIndex >= totalImages;
}

function updateCounter() {
  const counter = document.getElementById('imgCounter');
  if (totalImages > 1) {
    counter.textContent = currentImgIndex + ' / ' + totalImages;
    counter.style.display = 'block';
  } else {
    counter.style.display = 'none';
  }
}

async function loadItem(){
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  const loading = document.getElementById('loading');
  const notFound = document.getElementById('not-found');
  const detailLayout = document.getElementById('detailLayout');

  try {
    const res = await fetch('data.json');
    const data = await res.json();
    const index = data.findIndex(t => t.id === id);
    const item = index !== -1 ? data[index] : null;

    if (!item){
      loading.classList.add('hidden');
      notFound.classList.remove('hidden');
      return;
    }

    loading.classList.add('hidden');
    detailLayout.classList.remove('hidden');

    // Populate previous/next flank cards
    const total = data.length;
    const at = (offset) => total > 0 ? data[((index + offset) % total + total) % total] : null;

    const prev1 = total > 1 ? at(-1) : null;
    const next1 = total > 1 ? at(1) : null;
    let prev2 = total > 2 ? at(-2) : null;
    let next2 = total > 2 ? at(2) : null;

    if (prev2 && (prev2.id === item.id || prev2.id === next1?.id)) prev2 = null;
    if (next2 && (next2.id === item.id || next2.id === prev1?.id)) next2 = null;

    function fillFlank(prefix, flankItem){
      const el = document.getElementById(prefix);
      if (!flankItem){ return; }
      el.href = `item.html?id=${encodeURIComponent(flankItem.id)}`;
      document.getElementById(prefix + 'Img').src = flankItem.image;
      document.getElementById(prefix + 'Img').alt = flankItem.title;
      document.getElementById(prefix + 'Title').textContent = flankItem.title;
      el.classList.remove('hidden');
    }

    fillFlank('prevFlank1', prev1);
    fillFlank('prevFlank2', prev2);
    fillFlank('nextFlank1', next1);
    fillFlank('nextFlank2', next2);

    document.title = item.title + ' — Movie Quest Canada';
    document.getElementById('poster').src = item.image;
    document.getElementById('poster').alt = item.title;
    document.getElementById('formatTag').textContent = item.format;
    document.getElementById('title').textContent = item.title;
    document.getElementById('meta').textContent = [item.year, item.format, item.condition].filter(Boolean).join('  ·  ');
    document.getElementById('desc').textContent = item.desc || '';
    document.getElementById('price').textContent = item.price != null ? '$' + Number(item.price).toFixed(2) : '—';

    // ----- UPDATED: Button Logic -----
    const storeLink = document.getElementById('storeLink');
    const searchLink = document.getElementById('searchLink');

    // Set the secondary "View ALL eBay Listings" button
    searchLink.href = item.searchUrl || '#';

    // Primary button: only show if storeUrl exists and is not empty
    if (item.storeUrl && item.storeUrl.trim() !== '') {
      storeLink.href = item.storeUrl;
      storeLink.classList.remove('hidden');
    } else {
      storeLink.classList.add('hidden');
    }

    // ----- Movie Details Box -----
    const detailsBox = document.getElementById('movieDetailsBox');
    const detailGrid = document.getElementById('detailGrid');
    detailGrid.innerHTML = '';

    const detailsToShow = [];

    if (item.starring && item.starring.length) {
      detailsToShow.push({
        label: 'Starring',
        value: item.starring.map(a => `<span class="actor">${a}</span>`).join('')
      });
    }

    if (item.director) {
      detailsToShow.push({ label: 'Director', value: item.director });
    }

    if (item.producers && item.producers.length) {
      detailsToShow.push({
        label: 'Producers',
        value: item.producers.join(' • ')
      });
    }

    if (item.productionCompanies && item.productionCompanies.length) {
      detailsToShow.push({
        label: 'Production',
        value: item.productionCompanies.join(' • ')
      });
    }

    if (detailsToShow.length) {
      detailsBox.classList.remove('hidden');
      detailsToShow.forEach(d => {
        const div = document.createElement('div');
        div.className = 'detail-item';
        div.innerHTML = `
          <span class="label">${d.label}</span>
          <span class="value">${d.value}</span>
        `;
        detailGrid.appendChild(div);
      });
    } else {
      detailsBox.classList.add('hidden');
    }

    // ----- YouTube Trailer -----
    const trailerContainer = document.getElementById('trailerContainer');
    trailerContainer.innerHTML = '';
    if (item.youtubeTrailer) {
      const trailerDiv = document.createElement('div');
      trailerDiv.className = 'trailer-box';
      trailerDiv.innerHTML = `
        <iframe src="${item.youtubeTrailer}" 
                allowfullscreen 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                loading="lazy">
        </iframe>
      `;
      trailerContainer.appendChild(trailerDiv);
    } else {
      const placeholder = document.createElement('div');
      placeholder.className = 'trailer-placeholder';
      placeholder.textContent = '🎬 No trailer available for this title.';
      trailerContainer.appendChild(placeholder);
    }

    // ----- Tidbits -----
    const tidbitsSection = document.getElementById('tidbitsSection');
    const tidbitsList = document.getElementById('tidbitsList');
    if (item.tidbits && item.tidbits.length){
      tidbitsList.innerHTML = '';
      item.tidbits.forEach(t => {
        const li = document.createElement('li');
        li.textContent = t;
        tidbitsList.appendChild(li);
      });
      tidbitsSection.classList.remove('hidden');
    } else {
      tidbitsSection.classList.add('hidden');
    }

    // Initialize image carousel
    initCarousel(item.image);
    document.getElementById('imgPrev').addEventListener('click', () => changeImage(-1));
    document.getElementById('imgNext').addEventListener('click', () => changeImage(1));

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') changeImage(-1);
      if (e.key === 'ArrowRight') changeImage(1);
    });

  } catch (err){
    loading.textContent = 'Error loading item. Please check that data.json is in the same folder.';
    console.error(err);
  }
}

loadItem();
</script>
</body>
</html>
