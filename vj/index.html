<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP4 Video Joiner — Browser</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 24px;
            font-size: 0.95rem;
        }
        .drop-zone {
            border: 2px dashed #444;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            background: rgba(255,255,255,0.03);
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .drop-zone.dragover {
            border-color: #00d4ff;
            background: rgba(0,212,255,0.08);
        }
        .drop-zone p {
            color: #666;
            font-size: 1.1rem;
            pointer-events: none;
        }
        .drop-zone .icon {
            font-size: 3rem;
            margin-bottom: 12px;
            pointer-events: none;
        }
        .file-list {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            min-height: 60px;
        }
        .file-list:empty::before {
            content: "No files added yet";
            color: #555;
            display: block;
            text-align: center;
            padding: 20px;
        }
        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: rgba(255,255,255,0.07);
            border-radius: 8px;
            margin-bottom: 8px;
            transition: background 0.2s;
        }
        .file-item:hover {
            background: rgba(255,255,255,0.1);
        }
        .file-item .name {
            font-size: 0.9rem;
            color: #ddd;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-item .size {
            color: #666;
            font-size: 0.8rem;
            margin-right: 12px;
        }
        .file-item .btns {
            display: flex;
            gap: 6px;
        }
        .file-item button {
            background: transparent;
            border: 1px solid #444;
            color: #aaa;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        .file-item button:hover {
            border-color: #00d4ff;
            color: #00d4ff;
        }
        .file-item button.remove:hover {
            border-color: #ff4444;
            color: #ff4444;
        }
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .controls button {
            flex: 1;
            min-width: 140px;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-clear {
            background: #333;
            color: #fff;
        }
        .btn-clear:hover { background: #444; }
        .btn-merge {
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            color: #fff;
            font-size: 1.1rem;
        }
        .btn-merge:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .btn-merge:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 16px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: #aaa;
            min-height: 60px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .status .ok { color: #4ade80; }
        .status .err { color: #f87171; }
        .status .info { color: #60a5fa; }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #333;
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
            display: none;
        }
        .progress-bar.active { display: block; }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            width: 0%;
            transition: width 0.3s ease;
        }
        .download-link {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 20px;
            background: #22c55e;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }
        .download-link:hover { background: #16a34a; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 MP4 Video Joiner</h1>
        <p class="subtitle">Runs entirely in your browser — no upload to any server</p>

        <div class="drop-zone" id="dropZone">
            <div class="icon">📁</div>
            <p>Drop MP4 files here<br><small>or click to browse</small></p>
        </div>
        <input type="file" id="fileInput" multiple accept=".mp4,video/mp4">

        <div class="file-list" id="fileList"></div>

        <div class="controls">
            <button class="btn-clear" id="btnClear">🗑️ Clear All</button>
            <button class="btn-merge" id="btnMerge">🔥 Merge Videos</button>
        </div>

        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="status" id="status">Ready. Add MP4 files to begin.</div>
    </div>

    <script type="module">
        import { FFmpeg } from 'https://esm.sh/@ffmpeg/ffmpeg@0.12.10';
        import { fetchFile, toBlobURL } from 'https://esm.sh/@ffmpeg/util@0.12.1';

        // ── State ──
        let files = [];
        let ffmpeg = null;
        let isProcessing = false;

        // ── DOM refs ──
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const btnClear = document.getElementById('btnClear');
        const btnMerge = document.getElementById('btnMerge');
        const status = document.getElementById('status');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');

        // ── Helpers ──
        function log(msg, type = 'info') {
            const span = document.createElement('span');
            span.className = type;
            span.textContent = msg + '\n';
            status.appendChild(span);
            status.scrollTop = status.scrollHeight;
        }
        function clearLog() { status.innerHTML = ''; }
        function formatBytes(b) {
            if (b === 0) return '0 B';
            const k = 1024;
            const sizes = ['B','KB','MB','GB'];
            const i = Math.floor(Math.log(b) / Math.log(k));
            return parseFloat((b / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }
        function setProgress(pct) {
            progressBar.classList.add('active');
            progressFill.style.width = pct + '%';
        }

        // ── File list UI ──
        function renderList() {
            fileList.innerHTML = '';
            files.forEach((file, idx) => {
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `
                    <span class="name">${idx + 1}. ${file.name}</span>
                    <span class="size">${formatBytes(file.size)}</span>
                    <div class="btns">
                        <button ${idx === 0 ? 'disabled style="opacity:0.3"' : ''} onclick="moveFile(${idx}, -1)">⬆</button>
                        <button ${idx === files.length - 1 ? 'disabled style="opacity:0.3"' : ''} onclick="moveFile(${idx}, 1)">⬇</button>
                        <button class="remove" onclick="removeFile(${idx})">✕</button>
                    </div>
                `;
                fileList.appendChild(item);
            });
        }

        window.moveFile = (idx, dir) => {
            const newIdx = idx + dir;
            if (newIdx < 0 || newIdx >= files.length) return;
            [files[idx], files[newIdx]] = [files[newIdx], files[idx]];
            renderList();
        };
        window.removeFile = (idx) => {
            files.splice(idx, 1);
            renderList();
        };

        // ── Drag & drop ──
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        function handleFiles(fileListObj) {
            for (const f of fileListObj) {
                if (f.name.toLowerCase().endsWith('.mp4')) {
                    if (!files.some(x => x.name === f.name && x.size === f.size)) {
                        files.push(f);
                    }
                }
            }
            renderList();
            clearLog();
            log(`Added ${files.length} file(s). Ready to merge.`, 'ok');
        }

        btnClear.addEventListener('click', () => {
            files = [];
            renderList();
            clearLog();
            log('Cleared.', 'info');
            progressBar.classList.remove('active');
        });

        // ── Init FFmpeg ──
        async function initFFmpeg() {
            if (ffmpeg) return;
            clearLog();
            log('Loading FFmpeg.wasm (~25 MB)... Please wait.', 'info');
            setProgress(10);

            ffmpeg = new FFmpeg();
            ffmpeg.on('log', ({ message }) => {
                // Only show important messages
                if (message.includes('Error') || message.includes('error')) {
                    log(message, 'err');
                }
            });
            ffmpeg.on('progress', ({ progress }) => {
                setProgress(20 + Math.round(progress * 70));
            });

            const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
            try {
                await ffmpeg.load({
                    coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
                    wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
                });
                setProgress(100);
                setTimeout(() => progressBar.classList.remove('active'), 500);
                clearLog();
                log('FFmpeg ready! You can now merge videos.', 'ok');
            } catch (e) {
                log('Failed to load FFmpeg: ' + e.message, 'err');
                throw e;
            }
        }

        // ── Merge ──
        btnMerge.addEventListener('click', async () => {
            if (files.length < 2) {
                log('Need at least 2 files to merge.', 'err');
                return;
            }
            if (isProcessing) return;
            isProcessing = true;
            btnMerge.disabled = true;
            btnMerge.textContent = '⏳ Merging...';

            try {
                await initFFmpeg();
                clearLog();
                log('Starting merge...', 'info');
                setProgress(0);

                // Write files to FFmpeg virtual FS
                for (let i = 0; i < files.length; i++) {
                    const f = files[i];
                    log(`Writing ${f.name}...`);
                    const data = await fetchFile(f);
                    await ffmpeg.writeFile(`input${i}.mp4`, data);
                    setProgress(Math.round((i / files.length) * 20));
                }

                // Create concat list
                let concatList = '';
                for (let i = 0; i < files.length; i++) {
                    concatList += `file 'input${i}.mp4'\n`;
                }
                await ffmpeg.writeFile('concat_list.txt', concatList);
                log('Concat list created.', 'info');

                // Run FFmpeg
                // -safe 0 allows any filename
                // -c copy preserves quality (fast, no re-encode)
                // -movflags +faststart makes it web-friendly
                log('Running FFmpeg concat...', 'info');
                const exitCode = await ffmpeg.exec([
                    '-y',
                    '-f', 'concat',
                    '-safe', '0',
                    '-i', 'concat_list.txt',
                    '-c', 'copy',
                    '-movflags', '+faststart',
                    'output.mp4'
                ]);

                if (exitCode !== 0) {
                    throw new Error(`FFmpeg exited with code ${exitCode}`);
                }

                // Read result
                log('Reading output file...', 'info');
                const data = await ffmpeg.readFile('output.mp4');
                const blob = new Blob([data.buffer], { type: 'video/mp4' });
                const url = URL.createObjectURL(blob);

                // Cleanup virtual FS
                for (let i = 0; i < files.length; i++) {
                    await ffmpeg.deleteFile(`input${i}.mp4`);
                }
                await ffmpeg.deleteFile('concat_list.txt');
                await ffmpeg.deleteFile('output.mp4');

                setProgress(100);
                clearLog();
                log(`✅ Done! Merged ${files.length} videos.`, 'ok');

                // Show download
                const link = document.createElement('a');
                link.href = url;
                link.download = 'merged_video.mp4';
                link.className = 'download-link';
                link.textContent = '⬇ Download merged_video.mp4';
                status.appendChild(document.createElement('br'));
                status.appendChild(link);

            } catch (err) {
                clearLog();
                log('Merge failed.', 'err');
                log(err.message || String(err), 'err');
                log('', 'info');
                log('Tip: This usually means your MP4s have different codecs, resolutions, or frame rates. Try converting them to the same format first, or use a desktop FFmpeg with re-encoding.', 'info');
            } finally {
                isProcessing = false;
                btnMerge.disabled = false;
                btnMerge.textContent = '🔥 Merge Videos';
            }
        });
    </script>
</body>
</html>
