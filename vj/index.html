<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP4 Video Joiner + Trimmer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 6px;
            background: linear-gradient(90deg, #ff6b6b, #feca57);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { text-align: center; color: #888; margin-bottom: 20px; font-size: 0.9rem; }
        
        .drop-zone {
            border: 2px dashed #444;
            border-radius: 16px;
            padding: 35px;
            text-align: center;
            background: rgba(255,255,255,0.03);
            transition: all 0.3s;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .drop-zone.dragover { border-color: #feca57; background: rgba(254,202,87,0.08); }
        .drop-zone .icon { font-size: 2.5rem; margin-bottom: 8px; pointer-events: none; }
        .drop-zone p { color: #777; pointer-events: none; }
        
        input[type="file"] { display: none; }
        
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        
        .video-card {
            background: rgba(255,255,255,0.06);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #222;
            transition: transform 0.2s;
        }
        .video-card:hover { transform: translateY(-2px); border-color: #333; }
        
        .thumb-box {
            width: 100%;
            height: 150px;
            background: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        .thumb-box img, .thumb-box canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .thumb-box .placeholder {
            color: #555;
            font-size: 2rem;
        }
        .thumb-box .play-btn {
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(0,0,0,0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.5rem;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        .thumb-box:hover .play-btn { opacity: 1; }
        .thumb-box .duration {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0,0,0,0.7);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            color: #fff;
        }
        
        .card-body { padding: 14px; }
        .card-name {
            font-size: 0.85rem;
            color: #ddd;
            margin-bottom: 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .trim-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .trim-row label {
            font-size: 0.75rem;
            color: #888;
            width: 40px;
            flex-shrink: 0;
        }
        .trim-row input[type="range"] {
            flex: 1;
            accent-color: #feca57;
        }
        .trim-row .time {
            font-size: 0.75rem;
            color: #aaa;
            width: 50px;
            text-align: right;
            font-family: monospace;
        }
        
        .card-btns {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }
        .card-btns button {
            flex: 1;
            padding: 6px;
            border: 1px solid #333;
            background: transparent;
            color: #888;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .card-btns button:hover { border-color: #feca57; color: #feca57; }
        .card-btns button.remove:hover { border-color: #ff6b6b; color: #ff6b6b; }
        .card-btns button:disabled { opacity: 0.3; cursor: default; }
        
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        .controls button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-clear { background: #2a2a3e; color: #fff; }
        .btn-clear:hover { background: #33334d; }
        .btn-merge {
            background: linear-gradient(90deg, #ff6b6b, #feca57);
            color: #1a1a2e;
            font-size: 1.1rem;
        }
        .btn-merge:hover { opacity: 0.9; }
        .btn-merge:disabled { opacity: 0.4; cursor: not-allowed; }
        
        .status {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 14px;
            font-family: 'Courier New', monospace;
            font-size: 0.82rem;
            color: #aaa;
            min-height: 60px;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        .status .ok { color: #51cf66; }
        .status .err { color: #ff6b6b; }
        .status .info { color: #74c0fc; }
        .status .warn { color: #feca57; }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #222;
            border-radius: 3px;
            margin-bottom: 12px;
            overflow: hidden;
            display: none;
        }
        .progress-bar.active { display: block; }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #feca57);
            width: 0%;
            transition: width 0.3s;
        }
        
        .download-link {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 22px;
            background: #51cf66;
            color: #0f0f1a;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
        }
        .download-link:hover { background: #40c057; }
        
        /* Preview Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: #1a1a2e;
            border-radius: 16px;
            max-width: 800px;
            width: 100%;
            overflow: hidden;
            border: 1px solid #333;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #333;
        }
        .modal-header h3 { color: #fff; font-size: 1.1rem; }
        .modal-close {
            background: none;
            border: none;
            color: #888;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .modal-close:hover { color: #fff; }
        .modal-video {
            width: 100%;
            display: block;
            max-height: 60vh;
            background: #000;
        }
        .modal-trim-info {
            padding: 16px 20px;
            display: flex;
            gap: 20px;
            color: #aaa;
            font-size: 0.9rem;
            flex-wrap: wrap;
        }
        .modal-trim-info span { color: #feca57; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 MP4 Joiner + Trimmer</h1>
        <p class="subtitle">Trim start/end, click thumbnail to preview, then merge — all in your browser</p>
        
        <div class="drop-zone" id="dropZone">
            <div class="icon">📁</div>
            <p>Drop MP4 files here<br><small>or click to browse</small></p>
        </div>
        <input type="file" id="fileInput" multiple accept=".mp4,video/mp4">
        
        <div class="video-grid" id="videoGrid"></div>
        
        <div class="controls">
            <button class="btn-clear" id="btnClear">🗑️ Clear All</button>
            <button class="btn-merge" id="btnMerge">🔥 Merge Videos</button>
        </div>
        
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        
        <div class="status" id="status">Ready. Drop MP4 files to begin.</div>
    </div>

    <!-- Preview Modal -->
    <div class="modal-overlay" id="previewModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Preview</h3>
                <button class="modal-close" id="modalClose">✕</button>
            </div>
            <video class="modal-video" id="modalVideo" controls></video>
            <div class="modal-trim-info">
                <div>Original: <span id="modalOrigDur">0:00</span></div>
                <div>Trim: <span id="modalTrimStart">0:00</span> — <span id="modalTrimEnd">0:00</span></div>
                <div>Output: <span id="modalOutDur">0:00</span></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { FFmpeg } from 'https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js';
        import { fetchFile, toBlobURL } from 'https://unpkg.com/@ffmpeg/util@0.12.1/dist/esm/index.js';

        let files = [];
        let fileData = [];
        let ffmpeg = null;
        let isProcessing = false;

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const videoGrid = document.getElementById('videoGrid');
        const btnClear = document.getElementById('btnClear');
        const btnMerge = document.getElementById('btnMerge');
        const status = document.getElementById('status');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        
        // Modal refs
        const previewModal = document.getElementById('previewModal');
        const modalVideo = document.getElementById('modalVideo');
        const modalTitle = document.getElementById('modalTitle');
        const modalClose = document.getElementById('modalClose');
        const modalOrigDur = document.getElementById('modalOrigDur');
        const modalTrimStart = document.getElementById('modalTrimStart');
        const modalTrimEnd = document.getElementById('modalTrimEnd');
        const modalOutDur = document.getElementById('modalOutDur');

        function log(msg, type = 'info') {
            const span = document.createElement('span');
            span.className = type;
            span.textContent = msg + '\n';
            status.appendChild(span);
            status.scrollTop = status.scrollHeight;
        }
        function clearLog() { status.innerHTML = ''; }
        function setProgress(pct) {
            progressBar.classList.add('active');
            progressFill.style.width = pct + '%';
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function generateThumbnail(file, callback) {
            const video = document.createElement('video');
            video.preload = 'metadata';
            video.muted = true;
            video.playsInline = true;
            const url = URL.createObjectURL(file);
            video.src = url;
            
            video.onloadedmetadata = () => {
                video.currentTime = Math.min(1, video.duration / 2);
            };
            
            video.onseeked = () => {
                const canvas = document.createElement('canvas');
                canvas.width = 320;
                canvas.height = 180;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, 320, 180);
                URL.revokeObjectURL(url);
                callback(canvas.toDataURL('image/jpeg', 0.7), video.duration);
            };
            
            video.onerror = () => {
                URL.revokeObjectURL(url);
                callback(null, 0);
            };
        }

        function openPreview(idx) {
            const file = files[idx];
            const data = fileData[idx];
            if (!file) return;
            
            const url = URL.createObjectURL(file);
            modalVideo.src = url;
            modalTitle.textContent = file.name;
            modalOrigDur.textContent = formatTime(data.duration);
            modalTrimStart.textContent = formatTime(data.start);
            modalTrimEnd.textContent = formatTime(data.end);
            modalOutDur.textContent = formatTime(data.end - data.start);
            
            previewModal.classList.add('active');
            
            modalVideo.onloadedmetadata = () => {
                modalVideo.currentTime = data.start;
            };
        }

        modalClose.addEventListener('click', () => {
            previewModal.classList.remove('active');
            modalVideo.pause();
            URL.revokeObjectURL(modalVideo.src);
            modalVideo.src = '';
        });
        
        previewModal.addEventListener('click', (e) => {
            if (e.target === previewModal) {
                modalClose.click();
            }
        });

        function renderGrid() {
            videoGrid.innerHTML = '';
            files.forEach((file, idx) => {
                const data = fileData[idx] || { thumb: null, duration: 0, start: 0, end: 0 };
                
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <div class="thumb-box" id="thumb-${idx}">
                        <span class="placeholder">🎬</span>
                        <div class="play-btn">▶</div>
                        ${data.duration > 0 ? `<span class="duration">${formatTime(data.duration)}</span>` : ''}
                    </div>
                    <div class="card-body">
                        <div class="card-name">${idx + 1}. ${file.name}</div>
                        <div class="trim-row">
                            <label>Start</label>
                            <input type="range" id="start-${idx}" min="0" max="100" value="0" step="0.1">
                            <span class="time" id="startTime-${idx}">0:00</span>
                        </div>
                        <div class="trim-row">
                            <label>End</label>
                            <input type="range" id="end-${idx}" min="0" max="100" value="100" step="0.1">
                            <span class="time" id="endTime-${idx}">${formatTime(data.duration)}</span>
                        </div>
                        <div class="card-btns">
                            <button ${idx === 0 ? 'disabled' : ''} onclick="moveFile(${idx}, -1)">⬆</button>
                            <button ${idx === files.length - 1 ? 'disabled' : ''} onclick="moveFile(${idx}, 1)">⬇</button>
                            <button class="remove" onclick="removeFile(${idx})">✕</button>
                        </div>
                    </div>
                `;
                videoGrid.appendChild(card);

                // Thumbnail
                if (data.thumb) {
                    const thumbBox = card.querySelector(`#thumb-${idx}`);
                    thumbBox.innerHTML = `<img src="${data.thumb}" style="width:100%;height:100%;object-fit:cover;"><div class="play-btn">▶</div>${data.duration > 0 ? `<span class="duration">${formatTime(data.duration)}</span>` : ''}`;
                }
                
                // Preview click
                const thumbBox = card.querySelector(`#thumb-${idx}`);
                thumbBox.addEventListener('click', () => openPreview(idx));

                const startSlider = card.querySelector(`#start-${idx}`);
                const endSlider = card.querySelector(`#end-${idx}`);
                const startTime = card.querySelector(`#startTime-${idx}`);
                const endTime = card.querySelector(`#endTime-${idx}`);

                startSlider.addEventListener('input', () => {
                    const val = parseFloat(startSlider.value);
                    const sec = (val / 100) * data.duration;
                    data.start = sec;
                    startTime.textContent = formatTime(sec);
                    if (parseFloat(endSlider.value) <= val) {
                        endSlider.value = val + 1;
                        data.end = ((val + 1) / 100) * data.duration;
                        endTime.textContent = formatTime(data.end);
                    }
                });

                endSlider.addEventListener('input', () => {
                    const val = parseFloat(endSlider.value);
                    const sec = (val / 100) * data.duration;
                    data.end = sec;
                    endTime.textContent = formatTime(sec);
                    if (parseFloat(startSlider.value) >= val) {
                        startSlider.value = val - 1;
                        data.start = ((val - 1) / 100) * data.duration;
                        startTime.textContent = formatTime(data.start);
                    }
                });
            });
        }

        window.moveFile = (idx, dir) => {
            const newIdx = idx + dir;
            if (newIdx < 0 || newIdx >= files.length) return;
            [files[idx], files[newIdx]] = [files[newIdx], files[idx]];
            [fileData[idx], fileData[newIdx]] = [fileData[newIdx], fileData[idx]];
            renderGrid();
        };

        window.removeFile = (idx) => {
            files.splice(idx, 1);
            fileData.splice(idx, 1);
            renderGrid();
        };

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        function handleFiles(fileListObj) {
            let added = 0;
            for (const f of fileListObj) {
                if (f.name.toLowerCase().endsWith('.mp4')) {
                    if (!files.some(x => x.name === f.name && x.size === f.size)) {
                        const idx = files.length;
                        files.push(f);
                        fileData.push({ thumb: null, duration: 0, start: 0, end: 0 });
                        
                        generateThumbnail(f, (thumb, duration) => {
                            fileData[idx].thumb = thumb;
                            fileData[idx].duration = duration;
                            fileData[idx].end = duration;
                            renderGrid();
                        });
                        added++;
                    }
                }
            }
            if (added > 0) {
                clearLog();
                log(`Added ${added} file(s). Generating thumbnails...`, 'ok');
            }
        }

        btnClear.addEventListener('click', () => {
            files = [];
            fileData = [];
            renderGrid();
            clearLog();
            log('Cleared.', 'info');
            progressBar.classList.remove('active');
        });

        async function initFFmpeg() {
            if (ffmpeg) return;
            clearLog();
            log('Loading FFmpeg.wasm (~25 MB)... This is a one-time download.', 'info');
            setProgress(5);

            ffmpeg = new FFmpeg();
            
            // FIX: Use toBlobURL to bypass CORS entirely!
            // This fetches the files and turns them into same-origin blob URLs
            const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm';
            
            try {
                log('Fetching core files (bypassing CORS)...', 'info');
                
                const coreURL = await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript');
                const wasmURL = await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm');
                const workerURL = await toBlobURL(`${baseURL}/ffmpeg-core.worker.js`, 'text/javascript');
                
                setProgress(30);
                log('Initializing FFmpeg...', 'info');
                
                await ffmpeg.load({
                    coreURL: coreURL,
                    wasmURL: wasmURL,
                    workerURL: workerURL
                });
                
                setProgress(100);
                setTimeout(() => progressBar.classList.remove('active'), 500);
                clearLog();
                log('FFmpeg ready! You can now merge videos.', 'ok');
            } catch (e) {
                log('Failed to load FFmpeg: ' + e.message, 'err');
                log('If this keeps failing, try opening this file locally (double-click) instead of hosting it.', 'warn');
                throw e;
            }
        }

        btnMerge.addEventListener('click', async () => {
            if (files.length < 1) {
                log('Need at least 1 file.', 'err');
                return;
            }
            if (isProcessing) return;
            isProcessing = true;
            btnMerge.disabled = true;
            btnMerge.textContent = '⏳ Merging...';

            try {
                await initFFmpeg();
                clearLog();
                log('Preparing files...', 'info');
                setProgress(0);

                // Write all files to virtual FS
                for (let i = 0; i < files.length; i++) {
                    const f = files[i];
                    const data = await fetchFile(f);
                    await ffmpeg.writeFile(`input${i}.mp4`, data);
                    setProgress(Math.round((i / files.length) * 15));
                }

                // Build filter_complex for trim + concat
                let filterComplex = '';
                let concatInputs = '';
                let validCount = 0;

                for (let i = 0; i < files.length; i++) {
                    const d = fileData[i];
                    const start = d.start || 0;
                    const end = d.end || d.duration;
                    const duration = end - start;

                    if (duration <= 0.1) {
                        log(`Skipping ${files[i].name} (trimmed to zero)`, 'warn');
                        continue;
                    }

                    // Video trim + setpts to reset timestamps
                    filterComplex += `[${i}:v]trim=start=${start}:end=${end},setpts=PTS-STARTPTS[v${i}];`;
                    // Audio trim + asetpts
                    filterComplex += `[${i}:a]atrim=start=${start}:end=${end},asetpts=PTS-STARTPTS[a${i}];`;
                    concatInputs += `[v${i}][a${i}]`;
                    validCount++;
                }

                if (!concatInputs) {
                    throw new Error('No valid clips after trimming.');
                }

                filterComplex += `${concatInputs}concat=n=${validCount}:v=1:a=1[outv][outa]`;

                log('Running FFmpeg (this may take a while)...', 'info');
                setProgress(20);

                const exitCode = await ffmpeg.exec([
                    '-y',
                    ...files.flatMap((_, i) => ['-i', `input${i}.mp4`]),
                    '-filter_complex', filterComplex,
                    '-map', '[outv]',
                    '-map', '[outa]',
                    '-c:v', 'libx264',
                    '-preset', 'fast',
                    '-crf', '23',
                    '-c:a', 'aac',
                    '-b:a', '128k',
                    '-movflags', '+faststart',
                    'output.mp4'
                ]);

                if (exitCode !== 0) {
                    throw new Error(`FFmpeg exited with code ${exitCode}`);
                }

                log('Reading output...', 'info');
                const data = await ffmpeg.readFile('output.mp4');
                const blob = new Blob([data.buffer], { type: 'video/mp4' });
                const url = URL.createObjectURL(blob);

                // Cleanup virtual FS
                for (let i = 0; i < files.length; i++) {
                    await ffmpeg.deleteFile(`input${i}.mp4`);
                }
                await ffmpeg.deleteFile('output.mp4');

                setProgress(100);
                clearLog();
                log(`✅ Done! Merged ${validCount} clip(s).`, 'ok');

                const link = document.createElement('a');
                link.href = url;
                link.download = 'merged_video.mp4';
                link.className = 'download-link';
                link.textContent = '⬇ Download merged_video.mp4';
                status.appendChild(document.createElement('br'));
                status.appendChild(link);

            } catch (err) {
                clearLog();
                log('Merge failed.', 'err');
                log(err.message || String(err), 'err');
                log('', 'info');
                log('Tip: If you see CORS/worker errors, open this file locally instead of on a website.', 'warn');
            } finally {
                isProcessing = false;
                btnMerge.disabled = false;
                btnMerge.textContent = '🔥 Merge Videos';
            }
        });
    </script>
</body>
</html>
