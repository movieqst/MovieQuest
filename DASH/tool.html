<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tool Detail — AI Tools Directory</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0a0e1a;
    color: #c9d1d9;
    min-height: 100vh;
    padding: 20px;
    display: flex;
    justify-content: center;
  }

  .container {
    width: 100%;
    max-width: 900px;
  }

  .back-link {
    display: inline-block;
    margin-bottom: 20px;
    color: #8b949e;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    transition: color 0.2s;
  }
  .back-link:hover { color: #58a6ff; }

  .tool-detail {
    background: #161b22;
    border: 2px solid var(--accent, #58a6ff);
    border-radius: 16px;
    padding: 30px 40px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6);
  }

  .tool-header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 16px;
  }
  .tool-title-block {
    flex: 1;
    min-width: 0;
  }
  .cta-btn-header {
    margin-left: auto;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .tool-icon {
    width: 64px; height: 64px;
    border-radius: 14px;
    background: var(--accent-bg, rgba(88,166,255,0.1));
    display: flex; align-items: center; justify-content: center;
    font-size: 2.5rem;
    flex-shrink: 0;
    border: 1px solid var(--accent, #58a6ff);
  }
  .tool-name {
    font-size: 2.2rem;
    font-weight: 700;
    color: #e6edf3;
  }
  .tool-tagline {
    font-size: 1.1rem;
    color: #8b949e;
    margin-top: 4px;
  }
  .tool-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 15px 0 25px;
  }
  .meta-badge {
    background: var(--accent-bg, rgba(88,166,255,0.1));
    color: var(--accent, #58a6ff);
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 600;
    border: 1px solid var(--accent, #58a6ff);
    text-decoration: none;
    display: inline-block;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .meta-badge:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 10px currentColor;
  }
  .meta-badge.free { color: #3fb950 !important; border-color: #3fb950 !important; background: rgba(63,185,80,0.1) !important; }
  .meta-badge.paid { color: #c18c5a !important; border-color: #c18c5a !important; background: rgba(193,140,90,0.1) !important; }
  .meta-badge.affiliate { color: #ff6b6b !important; border-color: #ff6b6b !important; background: rgba(255,107,107,0.1) !important; }

  .section-title {
    font-size: 1.3rem;
    font-weight: 700;
    color: #e6edf3;
    margin: 28px 0 12px;
    border-bottom: 1px solid #1c2128;
    padding-bottom: 6px;
  }
  .detail-text {
    font-size: 1.05rem;
    line-height: 1.8;
    color: #c9d1d9;
    margin-bottom: 16px;
  }

  ul {
    list-style: none;
    padding: 0;
    margin: 10px 0 20px;
  }
  ul li {
    padding: 6px 0 6px 28px;
    position: relative;
    line-height: 1.6;
    font-size: 1.02rem;
  }
  ul li::before {
    content: "●";
    position: absolute;
    left: 4px;
    font-weight: 700;
  }
  .benefits li::before { color: #3fb950; }
  .drawbacks li::before { color: #f0883e; }

  .rating-section {
    display: flex;
    align-items: center;
    gap: 20px;
    margin: 20px 0;
    padding: 16px 20px;
    background: #0d1117;
    border-radius: 10px;
    border: 1px solid #1c2128;
  }
  .rating-value {
    font-size: 2.4rem;
    font-weight: 700;
    color: var(--accent, #58a6ff);
  }
  .rating-label {
    font-size: 0.85rem;
    color: #8b949e;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .cta-row {
    margin-top: 30px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    border-top: 1px solid #1c2128;
    padding-top: 20px;
  }
  .cta-btn {
    background: var(--accent, #58a6ff);
    color: #0a0e1a;
    padding: 12px 32px;
    border-radius: 8px;
    font-weight: 700;
    text-decoration: none;
    font-size: 1.1rem;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .cta-btn:hover { box-shadow: 0 0 20px var(--accent, #58a6ff); transform: translateY(-2px); }
  .cta-url {
    color: #8b949e;
    font-size: 0.95rem;
    word-break: break-all;
  }

  .traffic-display {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: #0d1117;
    border-radius: 8px;
    border: 1px solid #1c2128;
  }
  .traffic-number {
    font-size: 1.4rem;
    font-weight: 700;
    color: #e6edf3;
  }

  .not-found {
    text-align: center;
    padding: 60px 20px;
    color: #8b949e;
  }
  .not-found a { color: #58a6ff; text-decoration: none; }
  .not-found a:hover { text-decoration: underline; }

  @media (max-width: 640px) {
    .tool-detail { padding: 20px; }
    .tool-header { flex-wrap: wrap; }
    .tool-name { font-size: 1.6rem; }
    .cta-btn-header { margin-left: 0; width: 100%; justify-content: center; }
    .rating-section { flex-wrap: wrap; }
    .cta-row { flex-direction: column; align-items: stretch; }
    .cta-btn { justify-content: center; }
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="container" id="app">
  <!-- THE BACK LINK WAS CHANGED HERE -->
  <a class="back-link" href="dash.html"> ← MAIN AI DASH </a>

  <div id="loading" class="not-found">Loading tool details...</div>

  <div id="not-found" class="not-found hidden">
    <p>Couldn't find that tool in the catalog.</p>
    <p><a href="dash.html">← Return to the directory</a></p>
  </div>

  <div id="tool-detail" class="tool-detail hidden">
    <div class="tool-header">
      <div class="tool-icon" id="icon">💬</div>
      <div class="tool-title-block">
        <div class="tool-name" id="name">Tool Name</div>
        <div class="tool-tagline" id="tagline">Short description</div>
      </div>
      <a class="cta-btn cta-btn-header" id="ctaLink" href="#" target="_blank" rel="noopener">
        Visit <span id="ctaName">Tool</span> →
      </a>
    </div>

    <div class="tool-meta" id="meta-badges"></div>

    <div class="rating-section">
      <div>
        <div class="rating-value" id="rating">0.0</div>
        <div class="rating-label">Rating / 10</div>
      </div>
      <div class="traffic-display">
        <span class="traffic-number" id="traffic">0</span>
        <span style="color:#8b949e;">monthly visits</span>
      </div>
    </div>

    <div>
      <div class="section-title">Overview</div>
      <div class="detail-text" id="longDesc">Detailed description goes here...</div>
    </div>

    <div>
      <div class="section-title">✅ Benefits</div>
      <ul class="benefits" id="benefits"></ul>
    </div>

    <div>
      <div class="section-title">⚠️ Drawbacks</div>
      <ul class="drawbacks" id="drawbacks"></ul>
    </div>

    <div class="cta-row">
      <span class="cta-url" id="urlDisplay">example.com</span>
    </div>
  </div>
</div>

<script>
const slugify = (name) => name.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');

const categoryColors = {
  chat:  { accent: '#58a6ff', bg: 'rgba(88,166,255,0.1)' },
  image: { accent: '#f0883e', bg: 'rgba(240,136,62,0.1)' },
  video: { accent: '#39c5cf', bg: 'rgba(57,197,207,0.1)' },
  audio: { accent: '#a371f7', bg: 'rgba(163,113,247,0.1)' },
  code:  { accent: '#3fb950', bg: 'rgba(63,185,80,0.1)' },
  supercomputer: { accent: '#ff2d78', bg: 'rgba(255,45,120,0.1)' },
  niche: { accent: '#d29922', bg: 'rgba(210,153,34,0.1)' },
  notai: { accent: '#8b949e', bg: 'rgba(139,148,158,0.1)' },
  txtspeech: { accent: '#ff9bce', bg: 'rgba(255,155,206,0.1)' }
};

function formatTraffic(n) {
  if (!n && n !== 0) return '—';
  if (n >= 1000000) return (n / 1000000).toFixed(n % 1000000 === 0 ? 0 : 1) + 'M';
  if (n >= 1000) return Math.round(n / 1000) + 'K';
  return String(n);
}

function normalizeUrl(u) {
  if (!u) return '#';
  return /^https?:\/\//i.test(u) ? u : `https://${u}`;
}

async function loadTool() {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug') || params.get('name');

  const loading = document.getElementById('loading');
  const notFound = document.getElementById('not-found');
  const detail = document.getElementById('tool-detail');

  try {
    const res = await fetch('data.json');
    const data = await res.json();

    const tool = data.find(t => slugify(t.name) === slug);

    if (!tool) {
      loading.classList.add('hidden');
      notFound.classList.remove('hidden');
      return;
    }

    loading.classList.add('hidden');
    detail.classList.remove('hidden');

    const colors = categoryColors[tool.categories?.[0]] || categoryColors.chat;
    document.documentElement.style.setProperty('--accent', colors.accent);
    document.documentElement.style.setProperty('--accent-bg', colors.bg);

    document.title = tool.name + ' — AI Tools Directory';
    document.getElementById('icon').textContent = tool.icon || '★';
    document.getElementById('name').textContent = tool.name;
    document.getElementById('tagline').textContent = tool.desc || '';
    document.getElementById('rating').textContent = tool.rating || '—';
    document.getElementById('traffic').textContent = formatTraffic(tool.traffic);

    // Long description
    document.getElementById('longDesc').textContent = tool.overview || tool.desc || 'No detailed description available.';

    // Benefits
    const benefitsList = document.getElementById('benefits');
    benefitsList.innerHTML = '';
    (tool.benefits || ['No benefits listed yet.']).forEach(b => {
      const li = document.createElement('li');
      li.textContent = b;
      benefitsList.appendChild(li);
    });

    // Drawbacks
    const drawbacksList = document.getElementById('drawbacks');
    drawbacksList.innerHTML = '';
    (tool.drawbacks || ['No drawbacks listed yet.']).forEach(d => {
      const li = document.createElement('li');
      li.textContent = d;
      drawbacksList.appendChild(li);
    });

    // Meta badges
    const metaBadges = document.getElementById('meta-badges');
    metaBadges.innerHTML = '';
    const categoryNames = { code: 'Coding', niche: 'Niche AI', supercomputer: 'Supercomputer', notai: 'Not AI', txtspeech: 'Text-to-Speech' };
    
    // THE DYNAMIC COLOR LOGIC WAS ADDED HERE
    tool.categories.forEach(cat => {
      const a = document.createElement('a');
      a.className = 'meta-badge';
      a.href = `dash.html?category=${encodeURIComponent(cat)}`;
      a.textContent = categoryNames[cat] || cat.charAt(0).toUpperCase() + cat.slice(1);
      
      const catColor = categoryColors[cat];
      if (catColor) {
        a.style.color = catColor.accent;
        a.style.borderColor = catColor.accent;
        a.style.backgroundColor = catColor.bg;
      }
      
      metaBadges.appendChild(a);
    });

    const freeSpan = document.createElement('a');
    freeSpan.className = 'meta-badge ' + (tool.free ? 'free' : 'paid');
    freeSpan.href = `dash.html?free=${tool.free ? 'true' : 'false'}`;
    freeSpan.textContent = tool.free ? 'Free Tier' : 'Paid Only';
    metaBadges.appendChild(freeSpan);

    if (tool.affiliate) {
      const affSpan = document.createElement('span');
      affSpan.className = 'meta-badge affiliate';
      affSpan.textContent = 'Affiliate';
      metaBadges.appendChild(affSpan);
    }

    // CTA
    const url = normalizeUrl(tool.url);
    document.getElementById('ctaLink').href = url;
    document.getElementById('ctaName').textContent = tool.name;
    document.getElementById('urlDisplay').textContent = tool.url || '';

  } catch (err) {
    loading.textContent = 'Error loading data. Please check that data.json is in the same folder.';
    console.error(err);
  }
}

loadTool();
</script>
</body>
</html>
