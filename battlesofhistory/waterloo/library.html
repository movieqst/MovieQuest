<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Battle of Waterloo — Library of sources</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet">
<style>
  :root{--gold:#e9c77a;--ink:#09131a;--panel:#101f29;--line:#38505c;--text:#edf1ed;--muted:#9fb1b8}
  html,body{margin:0;background:#071017;color:var(--text);font:15px/1.5 system-ui,sans-serif}
  main{max-width:900px;margin:0 auto;padding:20px 16px 40px}
  h1{font:600 clamp(22px,4vw,32px) 'Cinzel',Georgia,serif;color:var(--gold);margin:6px 0}
  .lead{color:var(--muted);margin:0 0 18px}
  a{color:#9fc8ff}
  .book{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px 16px;margin:12px 0}
  .book h2{font:600 18px 'Cinzel',Georgia,serif;color:var(--gold);margin:0}
  .meta{color:var(--muted);font-size:13px;margin:2px 0 8px}
  .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .links a{border:1px solid var(--line);border-radius:6px;padding:4px 10px;text-decoration:none;font-size:13px}
  .links a.own{border-color:var(--gold);color:var(--gold)}
  .links span{border:1px dashed var(--line);border-radius:6px;padding:4px 10px;font-size:13px;color:var(--muted)}
  .small{font-size:12px;color:var(--muted)}
</style></head>
<body><main>
  <a href="index.html">◀ Back to the battle</a>
  <h1>Library of sources</h1>
  <p class="lead">Public-domain books and records behind the Battle of Waterloo. Where we keep our own copy, it is linked first, so it still works if an outside site moves.</p>
  <div id="lib"></div>
  <p class="small">The pictures in the game are kept on this site too; each one shows its source and licence under it.</p>
</main>
<script src="scenario.js"></script>
<script>
  const S = window.WATERLOO_SCENARIO, esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  document.getElementById('lib').innerHTML = (S.library || []).map(b => `<div class="book"><h2>${esc(b.title)}</h2>
    <div class="meta">${esc(b.author)} · ${b.year} · ${esc(b.kind)}</div><div>${esc(b.about)}</div>
    <div class="small" style="margin-top:6px">Used in the game: ${esc(b.citedIn)} · ${esc(b.rights)}</div>
    <div class="links">${b.local ? `<a class="own" href="sources/${esc(b.local)}">Our copy ▸</a>` : '<span>Our copy: to be added</span>'}
      ${b.gutenberg ? `<a href="${esc(b.gutenberg)}" target="_blank" rel="noopener">Project Gutenberg</a>` : ''}
      ${b.archive ? `<a href="${esc(b.archive)}" target="_blank" rel="noopener">Internet Archive</a>` : ''}</div></div>`).join('');
</script>
</body></html>
