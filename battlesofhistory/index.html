<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Battles of History</title>
<meta name="description" content="Narrated historical reenactments you can watch or command. Every fact tagged by how well it is known.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--gold:#e9c77a;--ink:#09131a;--panel:#101f29;--line:#38505c;--text:#edf1ed;--muted:#9fb1b8}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ink);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{min-height:100vh;background:radial-gradient(1200px 600px at 50% -10%,#1c3340 0%,var(--ink) 60%)}
  header{padding:56px 16px 24px;text-align:center;position:relative}
  /* Poster banner: images/poster.jpg (painted for this page) sits behind the title when present. */
  body.poster header{min-height:min(52vw,520px);display:flex;flex-direction:column;justify-content:flex-start;padding-top:48px;background:var(--banner,url('images/poster.jpg')) center 35%/cover no-repeat;border-bottom:1px solid #1b2b35}
  body.poster header::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,19,26,.55) 0%,rgba(9,19,26,.15) 35%,rgba(9,19,26,.1) 70%,rgba(9,19,26,1) 100%)}
  body.poster header>*{position:relative}
  body.poster .tag{color:#dfe6e3;text-shadow:0 1px 3px #000,0 0 10px rgba(0,0,0,.8);background:rgba(9,19,26,.35);padding:6px 12px;border-radius:8px}
  body.poster h1{text-shadow:0 2px 0 #5a4310,0 4px 18px rgba(0,0,0,.9),0 0 30px rgba(0,0,0,.7)}
  /* Banners whose painting has its quiet ground at the bottom: the title moves down onto it */
  body.poster.title-bottom header{justify-content:flex-end;padding-top:0;padding-bottom:28px}
  h1{font:800 clamp(30px,5vw,54px) 'Cinzel',Georgia,serif;color:var(--gold);letter-spacing:.14em;margin:0;text-shadow:0 1px 0 #5a4310,0 3px 12px rgba(0,0,0,.7)}
  .tag{color:var(--muted);margin:10px auto 0;max-width:640px;font-size:15px}
  .tag b{color:var(--text);font-weight:600}
  main{max-width:1100px;margin:0 auto;padding:12px 16px 40px;display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
  .card{display:grid;grid-template-rows:200px 1fr;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:transform .15s,border-color .15s,box-shadow .15s}
  a.card:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 14px 40px rgba(0,0,0,.5)}
  .cover{position:relative;background:#0a1620 center/cover no-repeat}
  .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,19,26,0) 40%,rgba(9,19,26,.95) 100%)}
  .era{position:absolute;top:10px;left:12px;z-index:1;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);background:rgba(9,19,26,.75);padding:3px 8px;border-radius:9px;border:1px solid rgba(233,199,122,.4)}
  .status{position:absolute;top:10px;right:12px;z-index:1;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:9px;background:rgba(9,19,26,.75);border:1px solid var(--line);color:var(--muted)}
  .status.ready{color:#5fcf8a;border-color:rgba(95,207,138,.5)}
  .status.soon{color:#e9c77a;border-color:rgba(233,199,122,.5)}
  .cover .title{position:absolute;left:14px;right:14px;bottom:10px;z-index:1}
  .cover h2{font:700 22px 'Cinzel',Georgia,serif;color:var(--gold);margin:0;letter-spacing:.06em;text-shadow:0 1px 0 #5a4310,0 2px 8px #000}
  .cover .date{color:var(--text);font-size:13px;text-shadow:0 1px 3px #000}
  .body{padding:12px 14px 14px}
  .sides{font-size:20px;font-weight:700;line-height:1.3;color:var(--text);margin:0 0 6px}
  .sides .vs{color:var(--text);font-weight:400;font-size:15px}
  .blurb{font-size:13.5px;color:var(--muted);margin:0 0 10px}
  .go{display:inline-block;font-weight:600;color:#fff;background:#214e75;border:1px solid #4c94c7;border-radius:8px;padding:6px 12px;font-size:13px}
  .credit{display:block;margin-top:8px;font-size:10.5px;color:#6f8691;font-style:italic}
  footer{text-align:center;color:#7f969f;font-size:12px;padding:10px 16px 30px;border-top:1px solid #1b2b35;max-width:1100px;margin:0 auto}
  footer a{color:var(--muted)}
  /* Timeline between the poster and the cards */
  #tlwrap{max-width:1100px;margin:18px auto 6px;padding:0 16px}
  #tlbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
  #tlbar .lbl{font:600 13px 'Cinzel',Georgia,serif;color:var(--gold);letter-spacing:.1em}
  #tlbar .ctl{display:flex;gap:6px}#tlbar button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit;font-size:12px}#tlbar button:hover{border-color:var(--gold)}
  #tl{position:relative;height:230px;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:linear-gradient(180deg,#0d1b24,#0a151d);cursor:grab;user-select:none;touch-action:none}
  #tl.drag{cursor:grabbing}
  #tltrack{position:absolute;top:0;bottom:0;left:0;will-change:transform}
  #tltrack .axis{position:absolute;left:0;right:0;top:50%;height:2px;background:linear-gradient(90deg,rgba(233,199,122,.25),var(--gold) 6%,var(--gold) 94%,rgba(233,199,122,.25))}
  #tltrack .tick{position:absolute;top:50%;width:1px;height:12px;margin-top:-6px;background:rgba(233,199,122,.7)}
  #tltrack .tick.minor{height:6px;margin-top:-3px;background:rgba(233,199,122,.35)}
  #tltrack .tick span{position:absolute;top:14px;left:0;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}
  #tltrack .now{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#5fcf8a;box-shadow:0 0 10px #5fcf8a}
  #tltrack .now span{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:10px;color:#5fcf8a;white-space:nowrap}
  .mini{position:absolute;width:118px;margin-left:-59px;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.5);transition:transform .12s,border-color .12s;z-index:1}
  .mini:hover{transform:scale(1.06);border-color:var(--gold);z-index:3}
  .mini.up{bottom:calc(50% + 14px)}.mini.down{top:calc(50% + 14px)}
  .mini .th{height:58px;background:#0a1620 center/cover no-repeat}
  .mini .t{font:600 10.5px 'Cinzel',Georgia,serif;color:var(--gold);padding:4px 6px 0;line-height:1.2}
  .mini .d{font-size:10px;color:var(--muted);padding:0 6px 5px}
  .mini .pin{position:absolute;left:50%;width:1px;height:14px;background:var(--gold)}
  .mini.up .pin{top:100%}.mini.down .pin{bottom:100%}
  .mini .dot{position:absolute;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
  .mini.up .dot{top:calc(100% + 10px)}.mini.down .dot{bottom:calc(100% + 10px)}
  #tlhint{font-size:11px;color:#6f8691;margin:6px 2px 0}
  @media(max-width:600px){#tl{height:200px}.mini{width:96px;margin-left:-48px}.mini .th{height:46px}}
</style>
</head>
<body>
<header>
  <h1>BATTLES OF HISTORY</h1>
</header>
<section id="tlwrap">
  <div id="tlbar"><span class="lbl">TIMELINE</span><span class="ctl"><button id="tlOut" title="Zoom out">−</button><button id="tlIn" title="Zoom in">+</button><button id="tlFit" title="Show the whole timeline">Fit</button></span></div>
  <div id="tl"><div id="tltrack"></div></div>
  <div id="tlhint">Scroll or pinch to zoom, drag to move. Click a battle to open it.</div>
</section>
<main id="list"></main>
<script>
  // Use the painted poster as the header background once images/poster.jpg exists.
  /* Random banner on each visit. Add a banner by putting its file in images/banners/ and adding a line here.
     titlePos 'top' keeps the title at the top; 'bottom' moves it onto the quiet ground at the foot of the painting. */
  const BANNERS = [
    { src: 'images/poster.jpg', titlePos: 'top' },
    { src: 'images/banners/waterloo-dawn.jpg', titlePos: 'bottom' }
  ];
  (function () {
    const show = b => {
      document.documentElement.style.setProperty('--banner', `url('${b.src}')`);
      document.body.classList.add('poster');
      if (b.titlePos === 'bottom') document.body.classList.add('title-bottom');
    };
    const pick = BANNERS[Math.floor(Math.random() * BANNERS.length)];
    const im = new Image();
    im.onload = () => show(pick);
    im.onerror = () => { const fb = new Image(); fb.onload = () => show(BANNERS[0]); fb.src = BANNERS[0].src; };
    im.src = pick.src;
  })();
</script>
<script src="battles.js"></script>
<script>
  const esc = t => String(t || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  // Two sides, split on 'vs.': the first in red, the second in blue. Text without 'vs.' is shown as it is.
  // Side colours: the battle's own colours (sideColors in battles.js). A battle without them gets a pair worked out from its folder name,
  // so it is the same on every visit.
  const SIDE_PALETTE = ['#2e8b57', '#d4a017', '#8e44ad', '#16a085', '#e67e22', '#2980b9', '#c0392b', '#7f8c8d'];
  const hashOf = t => [...String(t)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
  const pickSideColors = b => { if (b.sideColors) return b.sideColors; const h = hashOf(b.folder || b.title); const i = h % SIDE_PALETTE.length; let j = Math.floor(h / SIDE_PALETTE.length) % (SIDE_PALETTE.length - 1); if (j >= i) j++; return [SIDE_PALETTE[i], SIDE_PALETTE[j]]; };
  const sidesHTML = (t, colors) => { const m = String(t || '').split(/\s+vs\.?\s+/i); const [ca, cb] = colors || ['#ff6a5c', '#6aa6ff']; return m.length === 2 ? `<span style="color:${ca}">${esc(m[0])}</span> <span class="vs">vs.</span> <span style="color:${cb}">${esc(m[1])}</span>` : esc(t); };
  document.getElementById('list').innerHTML = (window.BATTLES || []).slice().sort((a, b) => (b.order || 0) - (a.order || 0)).map(b => `
    ${b.status === 'ready' ? `<a class="card" href="${esc(b.folder)}/index.html">` : '<div class="card">'}
      <div class="cover" style="background-image:url('${esc(b.folder)}/${esc(b.cover)}')">
        <span class="era">${esc(b.era)}</span>
        <span class="status ${b.status === 'ready' ? 'ready' : b.status === 'coming soon' ? 'soon' : ''}">${esc(b.status)}</span>
        <div class="title"><h2>${esc(b.title)}</h2><div class="date">${esc(b.date)} · ${esc(b.place)}</div></div>
      </div>
      <div class="body">
        <p class="sides">${sidesHTML(b.sides, pickSideColors(b))}</p>
        <p class="blurb">${esc(b.blurb)}</p>
        <span class="go">Open the battle ▶</span>
        <span class="credit">${esc(b.coverCredit)}</span>
      </div>
    ${b.status === 'ready' ? '</a>' : '</div>'}`).join('');
</script>
<script>
/* Timeline: linear years from a round number before the earliest battle up to today. Zoom and drag;
   battles alternate above and below the line, and overlapping ones separate as you zoom in. */
(function () {
  const B = (window.BATTLES || []).filter(b => typeof b.year === 'number').sort((a, b) => a.year - b.year);
  const tl = document.getElementById('tl'), track = document.getElementById('tltrack'); if (!B.length) { document.getElementById('tlwrap').style.display = 'none'; return; }
  const NOW = new Date().getFullYear();
  const first = Math.min(...B.map(b => b.year)), span0 = NOW - first;
  const roundDown = (y, step) => Math.floor(y / step) * step;
  const step0 = span0 > 2000 ? 500 : span0 > 500 ? 100 : 50;
  const START = roundDown(first, step0) - step0 * .5;            // a round number before the first battle, plus a little room
  const END = NOW + span0 * .08;                                   // and room after today for the last card
  const yrLabel = y => y < 0 ? (-y) + ' BCE' : y <= 0 ? '1 CE' : String(y);
  let zoom = 1, off = 0, W = 0;                                    // zoom factor, horizontal offset in px, visible width
  const px = y => (y - START) / (END - START) * W * zoom;          // year -> x in the track
  function build() {
    W = tl.clientWidth; track.style.width = Math.round(W * zoom) + 'px';
    const pxPerYear = W * zoom / (END - START);
    const steps = [1, 2, 5, 10, 25, 50, 100, 250, 500, 1000]; let step = steps.find(s => s * pxPerYear >= 90) || 1000; const minor = step / (step % 5 === 0 ? 5 : 2);
    let html = '<div class="axis"></div>';
    for (let y = roundDown(START, minor); y <= END; y += minor) { if (y < START) continue; const major = Math.abs(y / step - Math.round(y / step)) < 1e-9; html += `<div class="tick${major ? '' : ' minor'}" style="left:${px(y).toFixed(1)}px">${major ? '<span>' + yrLabel(y) + '</span>' : ''}</div>`; }
    html += `<div class="now" style="left:${px(NOW).toFixed(1)}px"><span>today</span></div>`;
    B.forEach((b, i) => { html += `<a class="mini ${i % 2 ? 'down' : 'up'}" href="${esc(b.folder)}/index.html" style="left:${px(b.year).toFixed(1)}px" title="${esc(b.title)} · ${esc(b.date)}"><div class="th" style="background-image:url('${esc(b.folder)}/${esc(b.cover)}')"></div><div class="t">${esc(b.title)}</div><div class="d">${esc(b.date)}</div><i class="pin"></i><i class="dot"></i></a>`; });
    track.innerHTML = html; place();
  }
  function place() { const max = Math.max(0, W * zoom - W); off = Math.max(-max, Math.min(0, off)); track.style.transform = `translateX(${off}px)`; }
  function zoomAt(f, cx) { const z2 = Math.max(1, Math.min(400, zoom * f)); if (z2 === zoom) return; const worldX = (cx - off) / zoom; zoom = z2; off = cx - worldX * zoom; build(); }
  document.getElementById('tlIn').onclick = () => zoomAt(1.6, W / 2); document.getElementById('tlOut').onclick = () => zoomAt(1 / 1.6, W / 2);
  document.getElementById('tlFit').onclick = () => { zoom = 1; off = 0; build(); };
  tl.addEventListener('wheel', e => { e.preventDefault(); const r = tl.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.25 : 1 / 1.25, e.clientX - r.left); }, { passive: false });
  let drag = null;
  tl.addEventListener('pointerdown', e => { drag = { x: e.clientX, off, moved: false }; tl.setPointerCapture(e.pointerId); tl.classList.add('drag'); });
  tl.addEventListener('pointermove', e => { if (!drag) return; const dx = e.clientX - drag.x; if (Math.abs(dx) > 4) drag.moved = true; off = drag.off + dx; place(); });
  tl.addEventListener('pointerup', e => { if (drag && drag.moved) { const stop = ev => { ev.preventDefault(); ev.stopPropagation(); }; tl.addEventListener('click', stop, { capture: true, once: true }); } drag = null; tl.classList.remove('drag'); });
  // pinch zoom on touch screens
  let pinch = null;
  tl.addEventListener('touchstart', e => { if (e.touches.length === 2) pinch = { d: Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY), zoom }; }, { passive: true });
  tl.addEventListener('touchmove', e => { if (pinch && e.touches.length === 2) { const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY), r = tl.getBoundingClientRect(), cx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left; zoomAt(pinch.zoom * d / pinch.d / zoom, cx); } }, { passive: true });
  tl.addEventListener('touchend', () => { pinch = null; });
  new ResizeObserver(() => build()).observe(tl); build();
})();
</script>
</body>
</html>
